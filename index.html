<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISO DOC CONTROL — Document & Records Management Console</title>
<style>
:root{
  --navy-900:#0b1424; --navy-800:#0f1e36; --navy-700:#152a4a; --navy-600:#1c3660;
  --green-500:#7ab72e; --green-600:#5f9424; --sky-400:#29abe2; --sky-500:#1f93c6;
  --ink:#101b2d; --ink-soft:#5c6a7e; --line:#dde3ec; --bg:#f2f4f8; --card:#ffffff;
  --ok:#2e9e5b; --warn:#c9860f; --danger:#c9424a; --radius:12px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;}
button,select,input,textarea{font-family:inherit;font-size:13px;}
a{color:var(--sky-500);}
h1,h2,h3,h4{margin:0;}
::-webkit-scrollbar{width:7px;height:7px;}
::-webkit-scrollbar-thumb{background:#c6cedb;border-radius:6px;}

#app{display:flex;min-height:100vh;}

/* Sidebar */
.sidebar{width:258px;flex:none;background:linear-gradient(180deg,var(--navy-900),var(--navy-700) 70%,var(--navy-900));
  color:#e7edf6;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden;transition:width .12s ease;}
.sidebar.no-transition{transition:none;}
.sidebar-resize-handle{position:absolute;top:0;right:-3px;width:6px;height:100%;cursor:ew-resize;z-index:20;background:transparent;}
.sidebar-resize-handle:hover,.sidebar-resize-handle.dragging{background:rgba(122,183,46,.45);}
.sidebar-collapse-btn{position:absolute;top:16px;right:-13px;width:26px;height:26px;border-radius:50%;background:var(--green-500);color:var(--navy-900);border:2px solid var(--navy-900);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;font-weight:900;z-index:21;}
.sidebar.collapsed{width:64px !important;}
.sidebar.collapsed .sidebar-logo{padding:16px 8px;}
.sidebar.collapsed .sidebar-logo .text,.sidebar.collapsed .role-switch,.sidebar.collapsed .nav-group,.sidebar.collapsed .nav-label,.sidebar.collapsed .nav-badge,.sidebar.collapsed .sidebar-foot,.sidebar.collapsed .sidebar-resize-handle{display:none;}
.sidebar.collapsed .nav-item{justify-content:center;padding:9px 0;}
.sidebar.collapsed .nav-item .ic{font-size:16px;}
.sidebar-logo{display:flex;flex-direction:column;align-items:center;text-align:center;gap:9px;padding:20px 16px 16px;border-bottom:1px solid rgba(255,255,255,.12);position:relative;}
.sidebar-logo .mark{height:50px;min-width:34px;max-width:190px;width:auto;border-radius:8px;background:var(--green-500);color:var(--navy-900);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;flex:none;overflow:hidden;padding:0;}
.sidebar-logo .mark.has-logo{background:#ffffff;padding:5px 8px;}
.sidebar-logo .mark img{display:block;width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain;}
.sidebar-logo .text{min-width:0;max-width:100%;overflow:hidden;}
.sidebar-logo .word{font-size:12.5px;font-weight:800;letter-spacing:.02em;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sidebar-logo .word span{color:var(--green-500);}
.sidebar-logo .sub{font-size:10px;color:#9db3cf;font-weight:600;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.logo-preview-box{margin-top:8px;display:inline-flex;align-items:center;justify-content:center;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fafbfc;max-width:100%;}
.logo-preview-box img{display:block;width:auto;height:auto;max-width:280px;max-height:110px;object-fit:contain;}
@media(max-width:600px){.logo-preview-box img{max-width:200px;max-height:80px;}}
.nav-scroll{flex:1;overflow-y:auto;padding:6px 10px;margin-top:4px;}
.nav-group{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#7f97b6;font-weight:700;padding:12px 8px 4px;}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:8px;cursor:pointer;font-size:12.7px;font-weight:600;color:#cfe0f2;transition:.15s;}
.nav-item:hover{background:rgba(255,255,255,.07);}
.nav-item.active{background:var(--green-500);color:#0b1424;}
.nav-item .ic{width:16px;text-align:center;flex:none;font-size:13px;}
.nav-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.nav-badge{font-size:10px;font-weight:800;background:rgba(255,255,255,.14);color:#dbe6f4;border-radius:10px;padding:1px 6px;flex:none;}
.nav-item.active .nav-badge{background:rgba(0,0,0,.18);color:#0b1424;}
.sidebar-foot{border-top:1px solid rgba(255,255,255,.12);padding:11px 16px;font-size:10.3px;color:#88a0bc;line-height:1.5;}
.role-switch{margin:0 14px 8px;}
.role-switch select{width:100%;background:rgba(255,255,255,.08);color:#e7edf6;border:1px solid rgba(255,255,255,.18);border-radius:7px;padding:6px 8px;font-size:11.5px;}

/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{background:var(--card);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5;}
.topbar h1{font-size:17px;margin:0;font-weight:800;color:var(--navy-900);}
.topbar .crumbs{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
.search-box{flex:1;max-width:340px;margin-left:auto;position:relative;}
.search-box input{width:100%;padding:8px 12px 8px 30px;border:1px solid var(--line);border-radius:8px;background:#f6f8fb;}
.search-box .ic{position:absolute;left:10px;top:8px;color:var(--ink-soft);font-size:12px;}
.btn{border:none;border-radius:8px;padding:8px 14px;font-weight:700;font-size:12.5px;cursor:pointer;}
.btn-primary{background:var(--sky-500);color:#fff;}
.btn-primary:hover{background:var(--sky-400);}
.btn-green{background:var(--green-500);color:#0b1424;}
.btn-ghost{background:#eef1f6;color:var(--ink);}
.btn-danger{background:#fbe4e6;color:var(--danger);}
.btn-sm{padding:5px 10px;font-size:11.5px;border-radius:6px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.icon-btn{position:relative;background:#eef1f6;border:none;border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:14px;}
.icon-btn .dot{position:absolute;top:-3px;right:-3px;background:var(--danger);color:#fff;font-size:9px;font-weight:800;border-radius:10px;min-width:15px;height:15px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
.content{padding:22px 26px 60px;max-width:1400px;}

/* Cards & grid */
.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}
.card h3{margin:0 0 10px;font-size:13px;font-weight:800;color:var(--navy-900);}
.card p.hint{font-size:12px;color:var(--ink-soft);margin:0 0 10px;line-height:1.55;}
.kpi{padding:16px 18px;}
.kpi .num{font-size:26px;font-weight:800;color:var(--navy-900);}
.kpi .lbl{font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-top:2px;}
.kpi .delta{font-size:11px;font-weight:700;margin-top:6px;}
.kpi .delta.ok{color:var(--ok);} .kpi .delta.warn{color:var(--warn);} .kpi .delta.danger{color:var(--danger);}

/* Bars */
.bar-bg{background:#e7ecf3;border-radius:6px;height:9px;overflow:hidden;}
.bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--sky-500),var(--green-500));}
.clause-row{display:flex;align-items:center;gap:10px;padding:7px 0;cursor:pointer;}
.clause-row:hover .clause-name{text-decoration:underline;}
.clause-row .clause-name{width:230px;flex:none;font-size:12.3px;font-weight:700;}
.clause-row .bar-bg{flex:1;}
.clause-row .pct{width:38px;text-align:right;font-size:11.5px;font-weight:800;color:var(--navy-900);}

/* Status pills */
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10.5px;font-weight:800;letter-spacing:.01em;white-space:nowrap;}
.pill-grey{background:#eaedf2;color:#5c6a7e;}
.pill-amber{background:#fdf1dc;color:#a06a06;}
.pill-green{background:#e4f5e9;color:#237a45;}
.pill-blue{background:#e2f0fc;color:#1f6fb4;}
.pill-red{background:#fbe4e6;color:#a3212d;}
.pill-purple{background:#efe6fb;color:#6d3fb0;}

/* Tables */
table{width:100%;border-collapse:collapse;font-size:12.4px;}
th{text-align:left;font-size:10.7px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap;}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
tr:hover td{background:#f8fafc;}
.table-wrap{overflow-x:auto;}
.link-cell{color:var(--sky-500);font-weight:700;cursor:pointer;}
.link-cell:hover{text-decoration:underline;}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.8px;}
.row-actions{display:flex;gap:6px;flex-wrap:wrap;}

/* Tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap;}
.tab{padding:9px 13px;font-size:12px;font-weight:700;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;}
.tab.active{color:var(--navy-900);border-color:var(--green-500);}

/* Forms */
.field{margin-bottom:12px;}
.field label{display:block;font-size:11px;font-weight:700;color:var(--ink-soft);margin-bottom:4px;}
.field .help{font-size:10.5px;color:#8a97a9;margin-top:3px;line-height:1.4;}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;}
.field textarea{resize:vertical;min-height:60px;}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.chip-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
.chip{background:#e2f0fc;color:#1f6fb4;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;display:flex;align-items:center;gap:6px;}
.chip .x{cursor:pointer;font-weight:900;opacity:.6;}
.chip .x:hover{opacity:1;}
.multi-check{max-height:180px;overflow-y:auto;border:1px solid var(--line);border-radius:7px;padding:8px;background:#fff;}
.multi-check label{display:flex;gap:7px;align-items:flex-start;font-size:12px;font-weight:500;color:var(--ink);padding:3px 0;cursor:pointer;}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,18,32,.5);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding:40px 16px;}
.modal{background:#fff;border-radius:14px;padding:22px 24px;width:660px;max-width:94vw;}
.modal.wide{width:920px;}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.modal-head h2{font-size:16px;font-weight:800;}
.modal-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--ink-soft);}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;border-top:1px solid var(--line);padding-top:14px;}

/* Misc */
.empty{padding:34px 10px;text-align:center;color:var(--ink-soft);}
.empty .big{font-size:28px;margin-bottom:8px;}
.empty .action{margin-top:12px;}
.banner{border-radius:10px;padding:11px 14px;font-size:12.3px;font-weight:600;display:flex;gap:9px;align-items:flex-start;margin-bottom:14px;}
.banner-info{background:#e2f0fc;color:#1f4e78;}
.banner-warn{background:#fdf1dc;color:#7a5205;}
.banner-danger{background:#fbe4e6;color:#7a1f27;}
.banner-ok{background:#e4f5e9;color:#1f6b3d;}
.section-title{font-size:14px;font-weight:800;margin:22px 0 10px;color:var(--navy-900);}
.section-title:first-child{margin-top:0;}
.doc-header-block{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:16px;}
.doc-header-block table td{font-size:12px;}
.doc-header-block table td:first-child{font-weight:700;color:var(--ink-soft);width:180px;background:#f8fafc;}
.timeline{border-left:2px solid var(--line);margin-left:8px;padding-left:16px;}
.timeline .tl-item{position:relative;padding-bottom:16px;}
.timeline .tl-item::before{content:"";position:absolute;left:-21px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--sky-500);}
.timeline .tl-item .tl-t{font-size:12px;font-weight:800;}
.timeline .tl-item .tl-m{font-size:11.5px;color:var(--ink-soft);margin-top:1px;}
.ai-callout{background:#f3edfb;border:1px solid #ddc9f5;border-radius:10px;padding:12px 14px;font-size:12px;color:#4a2e70;}
.toast-wrap{position:fixed;bottom:18px;right:18px;z-index:80;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--navy-900);color:#fff;padding:10px 16px;border-radius:8px;font-size:12.5px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:340px;}
.stepper{display:flex;flex-wrap:wrap;gap:0;font-size:10.5px;font-weight:700;margin-bottom:14px;}
.stepper .st{padding:5px 10px;background:#eaedf2;color:var(--ink-soft);border-radius:20px;margin:2px 4px 2px 0;}
.stepper .st.done{background:#e4f5e9;color:#237a45;}
.stepper .st.now{background:var(--sky-500);color:#fff;}
@media print{.sidebar,.topbar,.no-print{display:none !important;}.content{padding:0;max-width:none;}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast-wrap" id="toasts"></div>

<!-- Firebase (optional cloud sync) — safe to leave these as-is even before you configure Firebase.
     If FIREBASE_CONFIG below is left as placeholders, this console runs exactly as before: local
     browser storage only, no network calls to Firebase, nothing breaks. -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>

<script>
/* =========================================================================
   ISO DOC CONTROL — Document & Records Management Console
   Single-file implementation. Persists to localStorage always, and to
   Firebase (Firestore + Storage + Auth) as well once FIREBASE_CONFIG below
   is filled in — see the deployment guide for setup steps.
   Design system deliberately mirrors the supplied CMISA console reference.
   ========================================================================= */

/* ---------------------- OPTIONAL: Firebase cloud sync ----------------------
   Paste your Firebase project's config here (Firebase Console -> Project
   settings -> General -> Your apps -> SDK setup and configuration -> Config).
   Leave the placeholders as-is to keep running on local browser storage only. */
/* ---------------------- Build / version info (shown on the About screen) ---------------------- */
const BUILD_INFO = {
  appName: "ISO DOC CONTROL",
  platformFamily: "Digital Africa Industry Intelligence Platforms (IIP)",
  version: "1.5.0",
  build: "2026.09.12-2",
  releaseDate: "2026-09-12",
  developer: "Digital Africa (Pty) Ltd",
  developerTagline: "Building Africa's Digital Advantage",
  developerWebsite: "https://www.digitalafricagroup.co.za",
  developerEmail: "hello@digitalafricagroup.co.za",
  developerPhone: "+27 66 038 4041",
  developerAddress: "Unit 22, Block A, Willowbrook Office Park, 651 Van Hof Close, Ruimsig, Roodepoort, Gauteng, 1459, South Africa"
};

const FIREBASE_CONFIG = {
  apiKey: "PASTE_YOUR_API_KEY",
  authDomain: "PASTE_YOUR_PROJECT.firebaseapp.com",
  projectId: "PASTE_YOUR_PROJECT_ID",
  storageBucket: "PASTE_YOUR_PROJECT.appspot.com",
  messagingSenderId: "PASTE_YOUR_SENDER_ID",
  appId: "PASTE_YOUR_APP_ID"
};
const FIREBASE_ENABLED = (typeof firebase !== "undefined") && !!FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith("PASTE_");
let fbAuth=null, fbDb=null, fbStorage=null, fbUser=null;
const CLOUD_COLLECTION = "qms_projects";
/* This console's data is shared across every signed-in team member — not one private
   copy per Firebase account — so colleagues on different devices see the same
   documents, subject to the per-document access control set at creation/upload.
   Firestore Security Rules must restrict qms_projects/shared and qms_files/shared to
   "any authenticated user" — see the deployment guide. Fine-grained per-document
   visibility beyond that is enforced by this app, not by Firestore/Storage rules. */
const CLOUD_PROJECT_ID = "shared";
if(FIREBASE_ENABLED){
  firebase.initializeApp(FIREBASE_CONFIG);
  fbAuth = firebase.auth();
  fbDb = firebase.firestore();
  fbStorage = firebase.storage();
}
let _cloudSaveTimer = null;
function scheduleCloudSave(){
  if(!FIREBASE_ENABLED || !fbUser) return;
  clearTimeout(_cloudSaveTimer);
  _cloudSaveTimer = setTimeout(cloudSave, 1200);
}
async function cloudSave(){
  if(!FIREBASE_ENABLED || !fbUser) return;
  try{
    await fbDb.collection(CLOUD_COLLECTION).doc(CLOUD_PROJECT_ID).set({ state: JSON.stringify(state), updatedAt: new Date().toISOString(), updatedBy: fbUser.email||fbUser.uid });
    window._cloudSyncStatus = "synced"; window._cloudSyncTime = new Date().toISOString();
    refreshCloudBadge();
  }catch(e){ window._cloudSyncStatus = "error: "+(e.message||e); refreshCloudBadge(); }
}
async function cloudLoad(){
  if(!FIREBASE_ENABLED || !fbUser) return false;
  try{
    const doc = await fbDb.collection(CLOUD_COLLECTION).doc(CLOUD_PROJECT_ID).get();
    if(doc.exists && doc.data().state){ state = JSON.parse(doc.data().state); migrateState(); return true; }
    return false;
  }catch(e){ console.error("Cloud load failed", e); return false; }
}
/* Uploads a real File to Firebase Storage under a shared path so any signed-in team
   member, on any device, can retrieve it via its download URL. Returns null if
   Firebase isn't configured/signed-in, so callers fall back to local embedding. */
async function uploadFileToStorage(file){
  if(!FIREBASE_ENABLED || !fbUser || !fbStorage) return null;
  try{
    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
    const path = `qms_files/${CLOUD_PROJECT_ID}/${Date.now()}_${safeName}`;
    const ref = fbStorage.ref().child(path);
    await ref.put(file);
    const url = await ref.getDownloadURL();
    return {url, path};
  }catch(e){ console.error("Firebase Storage upload failed", e); return null; }
}
/* Generic "attach this file" handler used everywhere a file can be added (New Document,
   Upload Existing Document, External Documents, Records, Metadata). Tries Firebase
   Storage first (works across devices/users); falls back to embedding small files
   directly in the browser if Firebase isn't configured or the upload fails. */
async function attachFile(file){
  if(!file) return {fileName:"", fileType:"", fileSize:0, fileData:null, fileEmbedded:false, cloudUrl:"", storagePath:"", storedInCloud:false};
  const cloud = await uploadFileToStorage(file);
  let fileData = null, fileEmbedded = false;
  if(!cloud && file.size <= UPLOAD_MAX_EMBED_BYTES){
    fileData = await new Promise((resolve)=>{ const r=new FileReader(); r.onload=()=>resolve(r.result); r.onerror=()=>resolve(null); r.readAsDataURL(file); });
    fileEmbedded = !!fileData;
  }
  return {
    fileName: file.name, fileType: file.type||"", fileSize: file.size,
    fileData, fileEmbedded,
    cloudUrl: cloud?cloud.url:"", storagePath: cloud?cloud.path:"",
    storedInCloud: !!cloud
  };
}
function fileAttachmentBannerHTML(){
  if(FIREBASE_ENABLED && fbUser) return `<div class="help">Files upload to Firebase Storage so every signed-in team member can open them from any device. If the upload fails, small files (≤4MB) are kept in this browser only.</div>`;
  return `<div class="help">Firebase isn't connected, so files up to 4MB are kept in this browser only — not visible on other devices until Cloud Sync is enabled (Administration → Cloud Sync).</div>`;
}
function fileDownloadLinkHTML(d){
  if(d.storedInCloud && d.cloudUrl) return `<a class="btn btn-ghost btn-sm" href="${d.cloudUrl}" target="_blank" rel="noopener">⬇ Download original file</a>`;
  if(d.fileEmbedded && d.fileData) return `<a class="btn btn-ghost btn-sm" href="${d.fileData}" download="${esc(d.fileName||d.id||"file")}">⬇ Download original file (this device only)</a>`;
  return "";
}
/* ---------------------- Multi-provider AI calling ----------------------
   Claude (Anthropic) supports direct browser calls (it has an explicit opt-in
   header for this) so it's called straight from here with a browser-stored key.
   OpenAI's API has no such opt-in and blocks direct browser calls via CORS —
   and there is no generic public "Microsoft Copilot" API a third-party app can
   call with a personal key at all; the real technology behind Copilot-style
   enterprise integrations is Azure OpenAI Service, which is what "Copilot" means
   here. Both of those are therefore routed through a small Cloudflare Pages
   Function proxy (see the separate ai-proxy.js file) so the provider's key never
   has to sit in this browser at all — it lives as a Cloudflare environment
   secret instead, which is also just the more secure pattern regardless of CORS. */
const AI_PROVIDERS = {
  claude: {label:"Claude (Anthropic)", mode:"direct"},
  openai: {label:"ChatGPT (OpenAI)", mode:"proxy"},
  copilot: {label:"Microsoft Copilot (Azure OpenAI Service)", mode:"proxy"}
};
async function callAIProvider(prompt, maxTokens){
  maxTokens = maxTokens || 1800;
  const provider = state.org.aiProvider || "claude";
  const meta = AI_PROVIDERS[provider] || AI_PROVIDERS.claude;
  if(provider==="claude"){
    const key = (state.org.claudeApiKey||"").trim();
    if(!key) return {ok:false, provider:meta.label, configError:"No Anthropic API key configured. Go to Administration → AI Configuration."};
    try{
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body: JSON.stringify({ model:"claude-sonnet-4-6", max_tokens:maxTokens, messages:[{role:"user", content:prompt}] })
      });
      let data; try{ data = await response.json(); }catch(e){ data=null; }
      if(!response.ok){
        const msg = data && data.error && data.error.message ? data.error.message : `HTTP ${response.status} ${response.statusText}`;
        return {ok:false, provider:meta.label, apiError:msg, status:response.status};
      }
      const text = (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
      return {ok:true, provider:meta.label, text};
    }catch(err){ return {ok:false, provider:meta.label, networkError: err.message||String(err)}; }
  }
  // openai / copilot — both go through the same relative proxy endpoint
  try{
    const response = await fetch("/api/ai-proxy", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({provider, prompt, maxTokens})
    });
    let data; try{ data = await response.json(); }catch(e){ data=null; }
    if(!response.ok){
      const msg = data && data.error ? data.error : `HTTP ${response.status} ${response.statusText}`;
      return {ok:false, provider:meta.label, apiError:msg, status:response.status, isProxy:true};
    }
    return {ok:true, provider:meta.label, text: (data&&data.text)||""};
  }catch(err){ return {ok:false, provider:meta.label, networkError: err.message||String(err), isProxy:true}; }
}
function aiErrorHTML(result){
  if(result.configError) return `<div class="banner banner-danger">${esc(result.configError)}</div>`;
  if(result.apiError){
    let hint = "";
    if(result.isProxy) hint = `This means the request reached your Cloudflare Function proxy, but it returned an error — usually a missing or invalid environment variable (API key/endpoint/deployment name) on the Cloudflare Pages project. Check Administration → AI Configuration for the exact variable names needed.`;
    else if(result.status===401) hint = "This usually means the API key is missing or invalid — check it in Administration → AI Configuration.";
    else if(result.status===429) hint = "You've hit a rate or usage limit on this API key.";
    else if(result.status>=500) hint = `${esc(result.provider)}'s API may be temporarily unavailable — try again shortly.`;
    return `<div class="banner banner-danger"><b>AI request failed (${esc(result.provider)}):</b> ${esc(result.apiError)}${hint?"<br>"+hint:""}</div>`;
  }
  if(result.networkError){
    if(result.isProxy) return `<div class="banner banner-danger"><b>Could not reach the proxy endpoint</b> (${esc(result.networkError)}). ${esc(result.provider)} requires this console to be deployed on Cloudflare Pages with the included <span class="mono">functions/api/ai-proxy.js</span> function in place — it won't work from a locally-opened file or a host without that function. See Administration → AI Configuration.</div>`;
    return `<div class="banner banner-danger"><b>The request could not be sent</b> (${esc(result.networkError)}). This is usually a network/CORS block in this browser or environment.</div>`;
  }
  return `<div class="banner banner-danger">The AI service returned no content.</div>`;
}

function daysUntil(iso){ if(!iso) return null; return Math.ceil((new Date(iso) - new Date(todayISO()))/86400000); }
function fmtDate(iso){ if(!iso) return "—"; const d=new Date(iso); return d.toLocaleDateString("en-ZA",{day:"2-digit",month:"short",year:"numeric"}); }
function esc(s){ return (s===undefined||s===null)?"":String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* Backfills any keys missing from a previously saved (older-version) state object,
   so the console can evolve its data model without discarding a user's existing data. */
function migrateState(){
  const fresh = newState();
  if(!state || typeof state !== "object") { state = fresh; return; }
  Object.keys(fresh).forEach(k=>{
    if(state[k]===undefined) state[k]=fresh[k];
  });
  Object.keys(fresh.org).forEach(k=>{
    if(state.org[k]===undefined) state.org[k]=fresh.org[k];
  });
  if(!state.org.segregationRules) state.org.segregationRules = fresh.org.segregationRules;
  Object.keys(fresh.seq).forEach(k=>{ if(state.seq[k]===undefined) state.seq[k]=fresh.seq[k]; });
  (state.documents||[]).forEach(d=>{
    if(d.origin===undefined) d.origin = d.aiGenerated?"ai":"console";
    if(d.aiReviews===undefined) d.aiReviews = [];
    if(d.verificationCode===undefined) d.verificationCode = "";
    if(d.accessControl===undefined) d.accessControl = defaultAccessControl();
    if(d.storedInCloud===undefined) d.storedInCloud = false;
    if(d.cloudUrl===undefined) d.cloudUrl = "";
  });
  (state.externalDocs||[]).forEach(d=>{ if(d.accessControl===undefined) d.accessControl = defaultAccessControl(); });
  (state.records||[]).forEach(d=>{ if(d.accessControl===undefined) d.accessControl = defaultAccessControl(); });
  (state.users||[]).forEach(u=>{ if(u.grantedItems===undefined) u.grantedItems = []; });
  (state.approvals||[]).forEach(a=>{ if(a.version===undefined) a.version=""; });
}

/* ---------------------- Sidebar resize / collapse, fullscreen ---------------------- */
function toggleSidebarCollapse(){
  ui.sidebarCollapsed = !ui.sidebarCollapsed;
  saveUIPrefs();
  renderApp();
}
function startSidebarResize(e){
  e.preventDefault();
  if(ui.sidebarCollapsed) return;
  const handle = e.currentTarget;
  const sidebarEl = document.querySelector(".sidebar");
  handle.classList.add("dragging");
  sidebarEl.classList.add("no-transition");
  const startX = e.clientX;
  const startWidth = ui.sidebarWidth || 258;
  function onMove(ev){
    const newWidth = Math.max(180, Math.min(420, startWidth + (ev.clientX - startX)));
    ui.sidebarWidth = newWidth;
    if(sidebarEl) sidebarEl.style.width = newWidth + "px";
  }
  function onUp(){
    document.removeEventListener("mousemove", onMove);
    document.removeEventListener("mouseup", onUp);
    handle.classList.remove("dragging");
    if(sidebarEl) sidebarEl.classList.remove("no-transition");
    saveUIPrefs();
  }
  document.addEventListener("mousemove", onMove);
  document.addEventListener("mouseup", onUp);
}
function toggleFullscreen(){
  const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
  if(!isFs){
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if(!req){ toast("Full screen isn't supported in this browser."); return; }
    Promise.resolve(req.call(el)).catch(()=>{ toast("Full screen request was blocked by the browser."); });
  } else {
    const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
    if(exit) exit.call(document);
  }
}

/* ---------------------- Document-level access control ---------------------- */
/* "Viewing as" identifies which named person is using the console right now — separate
   from the role-preview switcher above it, which is a demo aid for testing permissions.
   This drives per-document/record/external-document visibility set at creation/upload. */
function currentUser(){
  if(!ui.currentUserId) return state.users[0]||null;
  return state.users.find(u=>u.id===ui.currentUserId) || state.users[0] || null;
}
function defaultAccessControl(){ return {mode:"everyone", users:[], roles:[], departments:[]}; }
function hasAccess(item, user){
  const ac = item && item.accessControl;
  if(!ac || !ac.mode || ac.mode==="everyone") return true;
  if(!user) return false;
  if(user.grantedItems && user.grantedItems.includes(item.id)) return true;
  if(ac.mode==="users") return (ac.users||[]).includes(user.name);
  if(ac.mode==="roles") return (ac.roles||[]).includes(user.role);
  if(ac.mode==="departments") return (ac.departments||[]).includes(user.dept);
  return false;
}
function accessibleDocuments(){ const u=currentUser(); return state.documents.filter(d=>hasAccess(d,u)); }
function accessibleExternalDocs(){ const u=currentUser(); return state.externalDocs.filter(d=>hasAccess(d,u)); }
function accessibleRecords(){ const u=currentUser(); return state.records.filter(d=>hasAccess(d,u)); }
function accessLabel(ac){
  if(!ac || !ac.mode || ac.mode==="everyone") return "Everyone";
  if(ac.mode==="users") return `Users: ${(ac.users||[]).join(", ")||"none set"}`;
  if(ac.mode==="roles") return `Roles: ${(ac.roles||[]).join(", ")||"none set"}`;
  if(ac.mode==="departments") return `Departments: ${(ac.departments||[]).join(", ")||"none set"}`;
  return "Everyone";
}
function accessControlFieldHTML(ac){
  ac = ac || defaultAccessControl();
  const deptList = [...new Set(Object.values(DEPARTMENT_GROUPS).flat())];
  return `<div class="field">
    <label>Who can access this?</label>
    <select name="accessMode" onchange="toggleAccessSubFields(this)">
      <option value="everyone" ${ac.mode==="everyone"?"selected":""}>Everyone (default)</option>
      <option value="users" ${ac.mode==="users"?"selected":""}>Specific users</option>
      <option value="roles" ${ac.mode==="roles"?"selected":""}>Specific system roles</option>
      <option value="departments" ${ac.mode==="departments"?"selected":""}>Specific departments</option>
    </select>
    <div class="help">Restricts who sees this in the register on their own device/account. A Super Administrator can still grant any individual user access from Administration → Users, regardless of this setting.</div>
  </div>
  <div data-access-sub="users" style="display:${ac.mode==="users"?"":"none"};" class="field">
    <label>Users with access</label>
    <div class="multi-check">${state.users.map(u=>`<label><input type="checkbox" name="accessUsers" value="${esc(u.name)}" ${(ac.users||[]).includes(u.name)?"checked":""}> ${esc(u.name)}</label>`).join("")||"<span style='color:var(--ink-soft)'>No users yet — add some under Administration.</span>"}</div>
  </div>
  <div data-access-sub="roles" style="display:${ac.mode==="roles"?"":"none"};" class="field">
    <label>Roles with access</label>
    <div class="multi-check">${ROLES.map(r=>`<label><input type="checkbox" name="accessRoles" value="${esc(r)}" ${(ac.roles||[]).includes(r)?"checked":""}> ${esc(r)}</label>`).join("")}</div>
  </div>
  <div data-access-sub="departments" style="display:${ac.mode==="departments"?"":"none"};" class="field">
    <label>Departments with access</label>
    <div class="multi-check">${deptList.map(d=>`<label><input type="checkbox" name="accessDepartments" value="${esc(d)}" ${(ac.departments||[]).includes(d)?"checked":""}> ${esc(d)}</label>`).join("")}</div>
  </div>`;
}
function toggleAccessSubFields(sel){
  const container = sel.closest("form")||document;
  container.querySelectorAll("[data-access-sub]").forEach(el=>{ el.style.display = el.dataset.accessSub===sel.value ? "" : "none"; });
}
function resolveAccessControl(f, formEl){
  const mode = f.get("accessMode")||"everyone";
  const users = Array.from(formEl.querySelectorAll('input[name="accessUsers"]:checked')).map(x=>x.value);
  const roles = Array.from(formEl.querySelectorAll('input[name="accessRoles"]:checked')).map(x=>x.value);
  const departments = Array.from(formEl.querySelectorAll('input[name="accessDepartments"]:checked')).map(x=>x.value);
  return {mode, users, roles, departments};
}

/* ---------------------- Alerts engine (derived, recomputed on render) ---------------------- */
function computeAlerts(){
  state.alerts = [];
  const schedule = (state.org.escalationSchedule||[90,60,30,7,0,-30]).slice().sort((a,b)=>b-a);
  state.documents.forEach(d=>{
    if(["Effective","Published","Under Revision"].includes(d.status) && d.dates.nextReview){
      const du = daysUntil(d.dates.nextReview);
      let level = null;
      for(const t of schedule){ if(du<=t) level = t; }
      const levelLabel = level===null?"": level>0?` — ${level}-day reminder`: level===0?" — due today":` — ${Math.abs(level)}+ days overdue`;
      if(du<0) state.alerts.push({kind:"Review overdue", severity:"danger", doc:d.id, name:d.name, detail:`${Math.abs(du)} day(s) overdue${levelLabel}`, date:d.dates.nextReview});
      else if(du<=90) state.alerts.push({kind:"Review due soon", severity: du<=7?"danger":du<=30?"warn":"info", doc:d.id, name:d.name, detail:`Due in ${du} day(s)${levelLabel}`, date:d.dates.nextReview});
      if(level!==null){
        d._escNotified = d._escNotified || [];
        if(!d._escNotified.includes(level)){
          d._escNotified.push(level);
          state.escalationLog.unshift({date:new Date().toISOString(), docId:d.id, docName:d.name, level, dueDate:d.dates.nextReview});
          if(state.escalationLog.length>300) state.escalationLog.length=300;
          notify("Review escalation", `${d.name} (${d.id}) reached the ${level>0?level+"-day":level===0?"due-date":Math.abs(level)+"-day overdue"} reminder for its next review.`, level<0?"warn":"info");
        }
      }
    }
  });
  state.records.forEach(r=>{
    const du = daysUntil(r.disposalDate);
    const onHold = state.legalHolds.some(h=>h.status==="Active" && h.records.includes(r.id));
    if(du!==null && du<=60 && !onHold){
      state.alerts.push({kind: du<0?"Disposal due":"Retention expiring soon", severity: du<0?"danger":"warn", doc:r.id, name:r.name, detail: du<0?`${Math.abs(du)} day(s) overdue`:`In ${du} day(s)`, date:r.disposalDate});
    }
  });
  state.requests.filter(r=>r.status==="Submitted").forEach(r=>{
    state.alerts.push({kind:"Request awaiting assessment", severity:"info", doc:r.id, name:r.name, detail:"Submitted "+fmtDate(r.date), date:r.date});
  });
  state.reviews.filter(r=>r.status==="Pending").forEach(r=>{
    const du = daysUntil(r.dueDate);
    if(du!==null && du<0) state.alerts.push({kind:"Review request overdue", severity:"danger", doc:r.docId, name:r.docName, detail:`${Math.abs(du)} day(s) overdue`, date:r.dueDate});
  });
  state.approvals.filter(a=>a.status==="Pending").forEach(a=>{
    state.alerts.push({kind:"Approval pending", severity:"warn", doc:a.docId, name:a.docName, detail:"Awaiting "+a.approver, date:a.requestedDate});
  });
  const sevRank = {danger:0,warn:1,info:2};
  state.alerts.sort((a,b)=>sevRank[a.severity]-sevRank[b.severity]);
}

/* ---------------------- Helpers: pills ---------------------- */
function statusPill(s){
  const map = {"Proposed":"grey","Draft":"grey","Under Review":"blue","Revision Required":"amber","Awaiting Approval":"amber",
    "Approved":"blue","Published":"green","Effective":"green","Under Revision":"amber","Superseded":"grey","Obsolete":"red",
    "Archived":"grey","Disposed":"red"};
  return `<span class="pill pill-${map[s]||"grey"}">${s}</span>`;
}
function critPill(c){ const map={"Critical":"red","High":"amber","Medium":"blue","Low":"grey"}; return `<span class="pill pill-${map[c]||"grey"}">${c}</span>`; }
function sevPill(s){ const map={danger:"red",warn:"amber",info:"blue"}; return `<span class="pill pill-${map[s]}">${s==="danger"?"Overdue":s==="warn"?"Due soon":"Info"}</span>`; }

      const mapped = docs.filter(d=>d.isoClauses && d.isoClauses.some(x=>clauses.includes(x))).length;
      const pct = clauses.length? Math.min(100, Math.round(mapped/clauses.length*100)) : 0;
      return `<div class="clause-row" onclick="goTo('iso')">
        <div class="clause-name">Clause ${c} — ${CLAUSE_GROUPS[c]}</div>
        <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>

      </div>`;
    }).join("")}

  <div class="section-title">AUS 32 / AdBlue (ISO 22241) evidence-based status</div>
  <div class="grid grid-4">
    ${kpi(aus32Effective,"Effective — evidence complete","ok")}
    ${kpi(aus32Partial,"Partial / implemented / needs review","warn")}
    ${kpi(aus32Gap,"Gap / planned only", aus32Gap?"danger":"ok")}
    ${kpi(aus32Issue,"Nonconforming / ineffective", aus32Issue?"danger":"ok")}
  </div>
  <div class="card" style="margin-top:16px;">
    ${STANDARDS.filter(s=>s.id!=="9001").map(s=>{
      const mapped = docs.filter(d=>d.isoClauses && d.isoClauses.some(x=>s.clauses.some(c=>c.n===x))).length;
      const pct = s.clauses.length? Math.min(100, Math.round(mapped/s.clauses.length*100)) : 0;
      return `<div class="clause-row" onclick="ui.isoStandard='${s.id}';goTo('iso')">
        <div class="clause-name">${esc(s.label)}</div>
        <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
        <div class="pct">${pct}%</div>
      </div>`;
    }).join("")}
  </div>

  <div class="grid grid-2" style="margin-top:20px;">
    <div class="card">
      <h3>Recent activity</h3>
      ${state.auditLog.slice(0,6).map(l=>`<div style="font-size:12px;padding:6px 0;border-bottom:1px solid var(--line);">

    </div>
    <div class="card">
      <h3>Top alerts</h3>
      ${state.alerts.slice(0,6).map(a=>`<div style="font-size:12px;padding:6px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;">
        <span><b>${esc(a.name)}</b><br><span style="color:var(--ink-soft);">${esc(a.kind)} · ${esc(a.detail)}</span></span>${sevPill(a.severity)}</div>`).join("")||emptyInline("No active alerts.")}
    </div>
  </div>`;
  document.getElementById("view").innerHTML = html;
}
function kpi(num,lbl,delta){
  const cls = delta==="ok"?"ok":delta==="warn"?"warn":delta==="danger"?"danger":"";
  return `<div class="card kpi"><div class="num">${num}</div><div class="lbl">${lbl}</div>${delta?`<div class="delta ${cls}">${delta==="ok"?"● On track":delta==="warn"?"● Needs attention":"● Action required"}</div>`:""}</div>`;
}
function emptyInline(msg){ return `<div style="font-size:12px;color:var(--ink-soft);padding:10px 0;">${msg}</div>`; }
function pendingReviewsFor(all){ return state.reviews.filter(r=>r.status==="Pending" && (all||r.reviewer===ui.role||true)); }
function pendingApprovalsFor(all){ return state.approvals.filter(a=>a.status==="Pending"); }
function pendingDCRs(){ return state.dcrs.filter(d=>["Submitted","Impact Assessed"].includes(d.status)); }

function renderDocuments(){

  if(ui.docFilter.status) docs = docs.filter(d=>d.status===ui.docFilter.status);
  if(ui.docFilter.type) docs = docs.filter(d=>d.type===ui.docFilter.type);
  docs.sort((a,b)=> (STATUS_ORDER[a.status]||0)-(STATUS_ORDER[b.status]||0) || a.name.localeCompare(b.name));

  let html = `
  <div class="row-actions no-print" style="margin-bottom:14px;">
    <button class="btn btn-ghost btn-sm" onclick="openUploadDocumentModal()">⬆ Upload Existing Document</button>

    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">

          <option value="">All statuses</option>
          ${STATUSES.map(s=>`<option ${ui.docFilter.status===s?"selected":""}>${s}</option>`).join("")}
        </select>
      </div>

        <label>Document type</label>

      <div class="help" style="width:100%;margin:0;">${state.documents.length>accessibleDocuments().length?`${state.documents.length-accessibleDocuments().length} additional document(s) exist but aren't visible to the current "Viewing as" user.`:""}</div>
    </div>
  </div>`;


  if(!docs.length){
    html += `<div class="card"><div class="empty"><div class="big">▤</div><div>No documents match your filters. Try changing your filters, create a new document, or upload one that already exists.</div>
      <div class="action row-actions" style="justify-content:center;"><button class="btn btn-primary btn-sm" onclick="openNewDocumentModal()">+ New Document</button><button class="btn btn-ghost btn-sm" onclick="openUploadDocumentModal()">⬆ Upload Existing Document</button></div></div></div>`;
  } else {
    html += `<div class="card table-wrap"><table><thead><tr>
      <th>ID</th><th>Name</th><th>Type</th><th>Owner</th><th>Ver/Rev</th><th>Status</th><th>ISO Clause</th>
      <th>Effective</th><th>Review</th><th>Criticality</th><th>Access</th><th>Actions</th></tr></thead><tbody>
      ${docs.map(d=>`<tr>
        <td class="mono link-cell" onclick="openDocProfile('${d.id}')">${d.id}</td>
        <td class="link-cell" onclick="openDocProfile('${d.id}')">${esc(d.name)}</td>

        <td>${esc(d.owner)}</td>

        <td>${(d.isoClauses||[]).map(clausePillHTML).join(" ")||"—"}</td>
        <td>${fmtDate(d.dates.effective)}</td>

        <td>${critPill(d.criticality)}</td>

/* "At a glance" — answers "what do I need to do next?" for anyone opening this document */
function pendingActionFor(d){
  if(d.status==="Draft") return "Request review when ready";
  if(d.status==="Under Review"){ const r=state.reviews.find(x=>x.docId===d.id && x.status==="Pending"); return r?`Awaiting ${r.type.toLowerCase()} from ${r.reviewer}`:"Awaiting reviewer action"; }
  if(d.status==="Revision Required") return "Resubmit after making the requested changes";
  if(d.status==="Awaiting Approval"){ const a=state.approvals.find(x=>x.docId===d.id && x.status==="Pending"); return a?`Awaiting approval from ${a.approver}`:"Awaiting approver decision"; }
  if(d.status==="Approved") return hasValidSignedApproval(d) ? "Ready to publish" : "Request formal Approval — a passed review alone is not sufficient to publish";
  if(["Effective","Published"].includes(d.status)) return d.dates.nextReview && daysUntil(d.dates.nextReview)<0 ? "Review is overdue — confirm the document is still suitable" : "None — document is in force";
  if(d.status==="Under Revision") return "Continue the revision, then request review";
  if(d.status==="Obsolete") return "Archive once retention requirements allow";
  if(d.status==="Archived") return "None — read-only";
  return "—";
}

/* ---------------------- Configurable workflow engine (advisory layer) ----------------------
   These workflow definitions describe what SHOULD happen for a given document type/
   criticality/department/process — stage sequence, SLA, and conditional guidance. They are
   surfaced on the document profile for reference. They deliberately do NOT replace or
   auto-drive the existing Request Review / Request Approval actions, since making them
   load-bearing would risk exactly the kind of workflow rewrite this phase is meant to avoid. */
function findMatchingWorkflow(d){
  let best=null, bestScore=-1;
  state.workflows.forEach(wf=>{
    let score=0, disqualified=false;
    if(wf.docType){ if(wf.docType===d.type) score+=4; else disqualified=true; }
    if(wf.criticality){ if(wf.criticality===d.criticality) score+=4; else disqualified=true; }
    if(wf.dept){ if(wf.dept===d.dept) score+=2; else disqualified=true; }
    if(wf.process){ if(wf.process===d.process) score+=3; else disqualified=true; }
    if(!disqualified && score>bestScore){ bestScore=score; best=wf; }
  });
  return best;
}
function evaluateWorkflowConditions(d){
  const notes = [];
  if(d.criticality==="Critical") notes.push("Criticality = Critical → an approver independent of owner/compiler/reviewer is required (enforced by Segregation of Duties rules).");
  if(d.trainingRequired) notes.push("Training required = Yes → a training/acknowledgement stage is triggered once this document is published (see Distribution & Training).");
  const relatedDCR = state.dcrs.find(x=>x.docId===d.id && ["Submitted","Impact Assessed","Approved for Revision","In Revision"].includes(x.status));
  if(relatedDCR && ["Medium","High"].includes(relatedDCR.complianceImpact)) notes.push(`Linked change request ${relatedDCR.id} flags ${relatedDCR.complianceImpact} compliance/legal impact — consider adding a Legal Review stage before approval.`);
  return notes;
}
function workflowProgressHTML(d, wf){
  if(!wf) return `<p class="help">No workflow definition matches this document's type, criticality, department or process yet. Configure one in Administration → Workflows.</p>`;
  const activeReview = state.reviews.find(r=>r.docId===d.id && r.status==="Pending");
  let currentIdx = -1;
  if(d.status==="Under Review" && activeReview) currentIdx = wf.stages.findIndex(s=>s.type==="review" && s.reviewType===activeReview.type);
  else if(d.status==="Awaiting Approval") currentIdx = wf.stages.findIndex(s=>s.type==="approval");
  else if(["Approved","Effective","Published"].includes(d.status)) currentIdx = wf.stages.length;
  return `<div class="stepper">${wf.stages.map((s,i)=>`<span class="st ${i<currentIdx?"done":i===currentIdx?"now":""}">${esc(s.name)} (${esc(s.type)}, ${s.slaDays}d SLA)</span>`).join("")}</div>`;
}
function workflowPanelHTML(d){
  const wf = findMatchingWorkflow(d);
  const conditions = evaluateWorkflowConditions(d);
  return `<div class="card" style="margin-bottom:16px;">
    <h3>Workflow${wf?` — ${esc(wf.name)}`:""}</h3>
    ${workflowProgressHTML(d, wf)}
    ${conditions.length?conditions.map(c=>`<div class="banner banner-info" style="margin-top:8px;">${esc(c)}</div>`).join(""):""}
    <p class="help" style="margin-top:8px;">Shown for reference — it doesn't auto-drive the document. Use the Request Review / Request Approval actions below as normal.</p>
  </div>`;
}

function deleteWorkflow(id){
  if(!confirm("Delete this workflow definition?")) return;

}

function hasValidSignedApproval(d){
  return state.approvals.some(a=>a.docId===d.id && a.version===d.version && a.status==="Approved" && a.signature && !a.signature.invalidated);

function applyDocTemplate(sel){
  const tplId = sel.value; if(!tplId) return;
  const tpl = state.templates.find(t=>t.id===tplId); if(!tpl) return;
  const form = sel.closest("form");
  const setVal = (name,val)=>{ const el = form.querySelector(`[name="${name}"]`); if(el && val!==undefined) el.value = val; };
  setVal("type", tpl.docType);
  setVal("description", tpl.defaultDescription);
  setVal("classification", tpl.defaultClassification);
  setVal("criticality", tpl.defaultCriticality);
  setVal("retentionPeriod", tpl.defaultRetention);
}
function openNewTemplateModal(){
  const html = `<div class="modal wide"><div class="modal-head"><h2>New Template</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
  <form id="tpl-form">
    <div class="row-2">
      <div class="field"><label>Applicable document type *</label><select name="docType" required>${DOC_TYPES.map(t=>`<option>${t}</option>`).join("")}</select></div>
      <div class="field"><label>Template name *</label><input name="name" required></div>
    </div>
    <div class="row-2">
      <div class="field"><label>Default classification</label><select name="defaultClassification">${CLASSIFICATIONS.map(c=>`<option>${c}</option>`).join("")}</select></div>
      <div class="field"><label>Default criticality</label><select name="defaultCriticality">${CRITICALITIES.map(c=>`<option>${c}</option>`).join("")}</select></div>
    </div>
    <div class="field"><label>Default retention period</label><input name="defaultRetention" value="5 years after superseded"></div>
    <div class="field"><label>Default description / purpose text</label><textarea name="defaultDescription" placeholder="Starter text — sections, prompts, or boilerplate to pre-fill."></textarea></div>
    <div class="modal-foot"><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button><button type="submit" class="btn btn-primary">Create Template</button></div>
  </form></div>`;
  openModal(html);
  document.getElementById("tpl-form").addEventListener("submit", function(e){
    e.preventDefault(); const f = new FormData(e.target);
    state.templates.push({id:uid("TPL"), docType:f.get("docType"), name:f.get("name"), defaultClassification:f.get("defaultClassification"),
      defaultCriticality:f.get("defaultCriticality"), defaultRetention:f.get("defaultRetention")||"5 years after superseded", defaultDescription:f.get("defaultDescription")||""});
    logAudit("Template created", "", f.get("name"), {objectType:"Template"});
    closeModal(); renderApp(); toast("Template created.");
  });
}
function deleteTemplate(id){
  if(!confirm("Delete this template?")) return;
  state.templates = state.templates.filter(t=>t.id!==id);
  logAudit("Template deleted", "", id, {objectType:"Template"});
  saveLocal(); renderApp(); toast("Template deleted.");
}
function docActionButtons(d){
  let btns = [];
  if(d.status==="Draft"){
    btns.push(`<button class="btn btn-primary btn-sm" onclick="openRequestReviewModal('${d.id}')">Request Review</button>`);
    btns.push(`<button class="btn btn-ghost btn-sm" onclick="openEditMetaShortcut('${d.id}')">Edit Metadata</button>`);
  }
  if(d.status==="Under Review"){
    btns.push(`<span class="pill pill-blue" style="padding:6px 10px;">Awaiting reviewer action</span>`);
  }
  if(d.status==="Revision Required"){
    btns.push(`<button class="btn btn-primary btn-sm" onclick="resubmitAfterRevision('${d.id}')">Mark Revised & Resubmit</button>`);
    btns.push(`<button class="btn btn-ghost btn-sm" onclick="openEditMetaShortcut('${d.id}')">Edit Metadata</button>`);
  }
  if(d.status==="Approved"){
    if(hasValidSignedApproval(d)) btns.push(`<button class="btn btn-green btn-sm" onclick="publishDocument('${d.id}')">Publish</button>`);
    else btns.push(`<button class="btn btn-primary btn-sm" onclick="openRequestApprovalModal('${d.id}')">Request Approval (signature required to publish)</button>`);
  }
  if(d.status==="Awaiting Approval"){
    btns.push(`<span class="pill pill-amber" style="padding:6px 10px;">Awaiting approver decision</span>`);
  }
  if(["Published","Effective"].includes(d.status)){
    btns.push(`<button class="btn btn-ghost btn-sm" onclick="startRevision('${d.id}')">Start Revision</button>`);
    btns.push(`<button class="btn btn-ghost btn-sm" onclick="openNewDCRModal('${d.id}')">Raise Change Request (DCR)</button>`);
    btns.push(`<button class="btn btn-danger btn-sm" onclick="obsoleteDocument('${d.id}')">Mark Obsolete</button>`);
  }
  if(d.status==="Under Revision"){
    btns.push(`<button class="btn btn-primary btn-sm" onclick="openRequestReviewModal('${d.id}')">Request Review of Revision</button>`);
    btns.push(`<button class="btn btn-ghost btn-sm" onclick="openEditMetaShortcut('${d.id}')">Edit Metadata</button>`);
  }
  if(d.status==="Obsolete"){
    btns.push(`<button class="btn btn-ghost btn-sm" onclick="archiveDocument('${d.id}')">Archive</button>`);
  }
  if(d.status==="Archived"){
    btns.push(`<span class="pill pill-grey" style="padding:6px 10px;">Read-only — archived document</span>`);
  }
  if(d.aiGenerated || true){
    btns.push(`<button class="btn btn-ghost btn-sm" onclick="openAIReviewModal('${d.id}')">AI Review</button>`);
  }
  btns.push(`<button class="btn btn-ghost btn-sm" onclick="window.print()">Print / Save PDF</button>`);
  return btns.join(" ");
}

function attachFileToDoc(docId){
  const d = findDoc(docId); if(!d) return;
  const input = document.getElementById('doc-file-input-'+docId);
  const file = input && input.files[0];

    Object.assign(d, {fileName:meta.fileName, fileData:meta.fileData, fileEmbedded:meta.fileEmbedded, cloudUrl:meta.cloudUrl, storagePath:meta.storagePath, storedInCloud:meta.storedInCloud});

function toggleDocClause(id,clause,checked){
  const d=findDoc(id); if(!d) return; d.isoClauses = d.isoClauses||[];
  if(checked && !d.isoClauses.includes(clause)) d.isoClauses.push(clause);
  if(!checked) d.isoClauses = d.isoClauses.filter(c=>c!==clause);
  logAudit("ISO clause mapping updated",id,clause+(checked?" added":" removed"));
  saveLocal();
}

/* ---------------------- Segregation of duties ---------------------- */
function checkSegregation(doc, approverName){
  const rules = (state.org && state.org.segregationRules) || {};
  const violations = [];
  if(!approverName) return violations;
  if(rules.compilerCannotApprove && doc.compiler && doc.compiler===approverName) violations.push("The compiler/author cannot approve their own document.");
  if(rules.reviewerCannotApprove && doc.techReviewer && doc.techReviewer===approverName) violations.push("The assigned reviewer cannot also be the approver.");
  if(rules.independentApprovalForCritical && doc.criticality==="Critical" && [doc.owner,doc.compiler,doc.techReviewer].filter(Boolean).includes(approverName)) violations.push("Critical documents require an approver independent of the owner, compiler and reviewer.");
  return violations;
}
function segregationViolationsHTML(violations){
  return `<div class="banner banner-warn"><b>Segregation of duties:</b><ul style="margin:6px 0 0 18px;padding:0;">${violations.map(v=>`<li>${esc(v)}</li>`).join("")}</ul></div>
    <div class="field"><label>Override reason (required to proceed)</label><input name="overrideReason" placeholder="Reason an authorised override is justified"></div>`;
}
function updateApprovalViolations(approverName, docId){
  const d = findDoc(docId);
  const el = document.getElementById("segregation-violations");
  if(!el || !d) return;
  const violations = checkSegregation(d, approverName);
  el.innerHTML = violations.length ? segregationViolationsHTML(violations) : "";
}
function invalidateApprovalsForDoc(docId){
  state.approvals.forEach(a=>{
    if(a.docId===docId && ["Pending","Approved"].includes(a.status)){
      a.status="Invalidated";
      if(a.signature) a.signature.invalidated = true;
    }
  });
}
function generateVerificationCode(d){
  const raw = `${d.id}|${d.version}|${d.revision}|${d.dates.effective}`;
  let hash = 0;
  for(let i=0;i<raw.length;i++){ hash = ((hash<<5)-hash + raw.charCodeAt(i))|0; }
  return Math.abs(hash).toString(36).toUpperCase().padStart(8,"0").slice(0,8);
}
/* Lightweight content hash over a document's controlled fields — not cryptographic,
   but sufficient to detect "has this version's substance changed" for signature
   invalidation and version-comparison purposes, without needing real file storage. */
function hashString(raw){
  let hash = 0;
  for(let i=0;i<raw.length;i++){ hash = ((hash<<5)-hash + raw.charCodeAt(i))|0; }
  return Math.abs(hash).toString(36).toUpperCase().padStart(10,"0").slice(0,10);
}
function generateContentHash(d){
  const raw = JSON.stringify({
    name:d.name, type:d.type, version:d.version, revision:d.revision, description:d.description,
    owner:d.owner, compiler:d.compiler, approver:d.approver, classification:d.classification,
    criticality:d.criticality, isoClauses:d.isoClauses, retentionPeriod:d.retentionPeriod,
    dept:d.dept, process:d.process, fileName:d.fileName
  });
  return hashString(raw);
}
/* Immutable snapshot of a document's controlled fields at a point in time — pushed to
   d.history whenever a version becomes Effective, so "version A vs version B" comparison
   and signature-integrity checks have something fixed to refer back to. */
function snapshotVersion(d, extra){
  return Object.assign({
    version:d.version, revision:d.revision, date:todayISO(),
    desc:d.changeDescription||"", compiler:d.compiler, approver:d.approver, owner:d.owner,
    status:d.status, classification:d.classification, criticality:d.criticality,
    isoClauses:[...(d.isoClauses||[])], retentionPeriod:d.retentionPeriod, dept:d.dept, process:d.process,
    description:d.description||"", contentHash: generateContentHash(d)
  }, extra||{});
}
/* ---------------------- Formal Document Version records ----------------------
   state.documentVersions is a genuine separate collection: DOCUMENT (the live object,
   representing current/mutable pointer state) vs DOCUMENT VERSION (an immutable record
   of one controlled state, keyed by documentId + versionNumber, containing every field
   called for — reviewers/approvers, all lifecycle dates, content hash, applicable
   processes/departments, related documents/records, training/distribution requirement).
   It runs alongside the lighter d.history snapshots (kept for backward compatibility
   with existing reports/comparisons) rather than replacing the live document object
   model, which would have required rewriting most of the file's read/write paths. */
function versionKey(docId, versionNumber){ return `${docId}@${versionNumber}`; }
function findVersionRecord(docId, versionNumber){
  return state.documentVersions.find(v=>v.documentId===docId && v.versionNumber===versionNumber);
}
function recordDocumentVersion(d, event, extra){
  const versionNumber = `${d.version}.${d.revision}`;
  const existing = findVersionRecord(d.id, versionNumber);
  const versionReviews = state.reviews.filter(r=>r.docId===d.id && r.signature && r.signature.version===d.version);
  const versionApprovals = state.approvals.filter(a=>a.docId===d.id && a.version===d.version);
  const approved = versionApprovals.slice().reverse().find(a=>a.status==="Approved");
  const rec = Object.assign({
    documentId: d.id, versionNumber, status: d.status, title: d.name, documentType: d.type,
    owner: d.owner, compiler: d.compiler,
    reviewers: versionReviews.map(r=>({name:r.reviewer, type:r.type, decision:r.status})),
    approvers: versionApprovals.map(a=>({name:a.approver, decision:a.status})),
    effectiveDate: d.dates.effective||"", reviewDate: d.dates.nextReview||"",
    revisionReason: d.changeDescription||"", changeSummary: "",
    createdBy: existing?existing.createdBy:(d.compiler||currentUserName()), createdAt: existing?existing.createdAt:new Date().toISOString(),
    approvedBy: approved?approved.approver:(existing?existing.approvedBy:""), approvedAt: approved?approved.decisionDate:(existing?existing.approvedAt:""),
    publishedBy: existing?existing.publishedBy:"", publishedAt: existing?existing.publishedAt:"",
    supersededDate: existing?existing.supersededDate:"", obsoleteDate: existing?existing.obsoleteDate:"", archiveDate: existing?existing.archiveDate:"",
    contentRef: d.fileName||"", contentHash: generateContentHash(d),
    classification: d.classification, criticality: d.criticality,
    applicableProcesses: [d.process].filter(Boolean), applicableDepartments: [d.dept].filter(Boolean),
    isoClauses: [...(d.isoClauses||[])], relatedDocuments: [...(d.relatedDocs||[])],
    relatedRecords: state.records.filter(r=>r.originatingDoc===d.name).map(r=>r.id),
    trainingRequirement: !!d.trainingRequired, distributionRequirement: (d.distribution||[]).length>0,
    lastEvent: event
  }, extra||{});
  if(existing){ Object.assign(existing, rec); return existing; }
  state.documentVersions.push(rec);
  return rec;
}

function completeReview(reviewId, decision){

      action: r.status, timestamp: new Date().toISOString(), docId: d.id, version: d.version,

    };

    else if(decision==="reject"||decision==="changes"){ d.status="Revision Required"; notify("Changes requested",`${d.name} requires revision after review.`,"warn"); }
    logAudit(`Review ${r.status.toLowerCase()}`, d.id, comments, {objectType:"Review", previousState:prevStatus, newState:d.status});

function decideApproval(approvalId, decision){
  if(!can("document.approve")){ denyToast("document.approve"); return; }
  const a = state.approvals.find(x=>x.id===approvalId); if(!a) return;
  const d = findDoc(a.docId);
  if(d && a.version && a.version!==d.version){
    alert("This approval was requested against an earlier version of the document and can no longer be actioned — the document has since changed. Please request approval again for the current version.");
    a.status="Invalidated"; saveLocal(); renderApp(); return;
  }
  const comments = prompt(`Add approval comments (${decision}):`,"")||"";
  a.status = decision==="approve"?"Approved":"Rejected";
  a.comments=comments; a.decisionDate=todayISO();
  if(d){
    // Electronic signature: capture signer identity, intent, exact version and content hash at the moment of decision
    const signer = currentUser();
    a.signature = {
      signatureId: uid("SIG"), signerName: signer?signer.name:currentUserName(), signerRole: signer?signer.role:ui.role,
      action: decision==="approve"?"Approved":"Rejected", timestamp: new Date().toISOString(),
      docId: d.id, version: d.version, contentHash: generateContentHash(d), comments, invalidated:false
    };
    if(decision==="approve"){ d.status="Approved"; d.dates.approval=todayISO(); logAudit("Document approved",d.id,comments,{objectType:"Approval",previousState:"Pending",newState:"Approved"}); notify("Document approved",`${d.name} was approved and is ready to publish.`,"ok"); }
    else { d.status="Revision Required"; logAudit("Document rejected at approval",d.id,comments,{objectType:"Approval",previousState:"Pending",newState:"Rejected"}); notify("Approval rejected",`${d.name} was rejected at approval and requires revision.`,"warn"); invalidateApprovalsForDoc(d.id); }
  }
  saveLocal(); renderApp(); toast("Approval recorded.");
}
function publishDocument(docId){
  const d = findDoc(docId); if(!d) return;
  if(d.status!=="Approved" || !hasValidSignedApproval(d)){
    alert("A document can only be published once a valid electronic signature of approval exists for this exact version. Use \"Request Approval\" and have the approver sign off before publishing — passing a review alone is not sufficient.");
    return;
  }
  const previousVersion = d.version;
  // Supersede previous effective version with same name/process if any (separate-document case)
  const prior = state.documents.find(p=>p.id!==d.id && p.name===d.name && ["Effective","Published"].includes(p.status));
  if(prior){ prior.status="Superseded"; d.supersededVersion=prior.version; logAudit("Superseded by new version",prior.id,`Superseded by ${d.id}`,{objectType:"Document",previousState:"Effective",newState:"Superseded"}); }
  const prevStatus = d.status;
  d.status="Effective";
  if(!d.dates.effective) d.dates.effective = todayISO();
  const months = state.org.reviewMonths[d.criticality] || 24;
  d.dates.nextReview = addMonths(d.dates.effective, months);
  d.verificationCode = generateVerificationCode(d);
  d.contentHash = generateContentHash(d);
  const approvalForThisVersion = state.approvals.slice().reverse().find(a=>a.docId===d.id && a.version===d.version && a.status==="Approved");
  d.history.push(snapshotVersion(d, {
    approvedBy: approvalForThisVersion?approvalForThisVersion.approver:d.approver,
    approvedAt: approvalForThisVersion?approvalForThisVersion.decisionDate:d.dates.approval,
    publishedBy: currentUser()?currentUser().name:currentUserName(), publishedAt: todayISO(),
    effectiveDate: d.dates.effective, signatureId: approvalForThisVersion?.signature?.signatureId||""
  }));
  // Same-document revision cycle: flag any controlled copies still referencing the version being superseded
  const stale = state.controlledCopies.filter(c=>c.docId===d.id && c.version!==d.version && c.status!=="Revoked");
  stale.forEach(c=>{ c.status = "Revoked"; c.revokedDate = todayISO(); c.revokedReason = `Superseded by v${d.version}`; });
  if(stale.length){
    logAudit("Controlled copies auto-revoked on republish", d.id, `${stale.length} copy/copies of v${previousVersion} revoked`, {objectType:"ControlledCopy"});
    notify("Controlled copies need re-issue", `${stale.length} controlled copy/copies of ${d.name} referenced the superseded version and were revoked — re-issue against v${d.version} if still needed.`, "warn");
  }
  if(d.activeDCR){
    const dcr = state.dcrs.find(x=>x.id===d.activeDCR);
    if(dcr && dcr.status!=="Completed"){ dcr.status="Completed"; logAudit("DCR completed — linked document published", d.id, dcr.id, {objectType:"DCR", newState:"Completed"}); }
    d.activeDCR = null;
  }
  logAudit("Document published — now Effective", d.id, `Next review ${d.dates.nextReview}`, {objectType:"Document", previousState:prevStatus, newState:"Effective"});
  // Mark the previous Effective version record (same document, same-ID revision cycle) as superseded —
  // this is the common path; the separate-document "prior" case below is the rarer one.
  const currentVersionNumber = `${d.version}.${d.revision}`;
  const priorEffectiveRec = state.documentVersions
    .filter(v=>v.documentId===d.id && v.status==="Effective" && v.versionNumber!==currentVersionNumber)
    .sort((a,b)=>new Date(b.publishedAt||b.createdAt||0)-new Date(a.publishedAt||a.createdAt||0))[0];
  if(priorEffectiveRec) priorEffectiveRec.supersededDate = todayISO();
  recordDocumentVersion(d, "Published", {publishedBy: currentUser()?currentUser().name:currentUserName(), publishedAt: todayISO(), effectiveDate: d.dates.effective});
  if(prior){
    const priorVersionNumber = `${prior.version}.${prior.revision}`;
    const priorRec = findVersionRecord(prior.id, priorVersionNumber);
    if(priorRec) priorRec.supersededDate = todayISO();
  }
  notify("Document published", `${d.name} (${d.id}) is now Effective. Next review ${fmtDate(d.dates.nextReview)}.`, "ok");
  if(d.trainingRequired){ notify("Training required", `${d.name} requires training/acknowledgement — see Distribution & Training.`, "warn"); }
  saveLocal(); renderApp(); toast("Document published.");
}
function startRevision(docId, dcrId){
  const d = findDoc(docId); if(!d) return;
  const prevStatus = d.status;
  const parts = d.version.split(".").map(Number);
  invalidateApprovalsForDoc(docId);
  d.status="Under Revision";
  d.version = `${parts[0]}.${(parts[1]||0)+1}`;
  d.revision = String(Number(d.revision||0)+1).padStart(2,"0");
  if(dcrId) d.activeDCR = dcrId;
  logAudit("Revision started", d.id, `New working version ${d.version}${dcrId?` (from ${dcrId})`:""}`, {objectType:"Document", previousState:prevStatus, newState:"Under Revision"});
  const dcr = dcrId?state.dcrs.find(x=>x.id===dcrId):null;
  recordDocumentVersion(d, "Revision started", {revisionReason: dcr?dcr.reason:d.changeDescription||""});
  toast("Revision started."); renderApp();
}

/* ================================================================
   IMPACT ANALYSIS  (used by DCRs and by "Start Revision")
   ================================================================ */
function computeImpactAnalysis(doc){
  if(!doc) return {relatedDocs:[], relatedRecords:[], isoClauses:[], trainingFlag:false, distributionCount:0, severity:"Low"};
  const relatedDocs = (doc.relatedDocs||[]).map(id=>findDoc(id)).filter(Boolean);
  const relatedRecords = state.records.filter(r=>r.originatingDoc===doc.name);
  const isoClauses = doc.isoClauses||[];
  const trainingFlag = !!doc.trainingRequired;
  const distributionCount = (doc.distribution||[]).length;
  const relCount = relatedDocs.length + relatedRecords.length + isoClauses.length;
  let severity = "Low";
  if(doc.criticality==="Critical" || relCount>=5) severity = "Critical";
  else if(doc.criticality==="High" || relCount>=3) severity = "High";
  else if(relCount>=1) severity = "Medium";
  return {relatedDocs, relatedRecords, isoClauses, trainingFlag, distributionCount, severity};
}
function impactAnalysisHTML(doc){
  if(!doc) return emptyInline("No document selected.");
  const ia = computeImpactAnalysis(doc);
  const sevMap = {Low:"pill-grey",Medium:"pill-blue",High:"pill-amber",Critical:"pill-red"};
  return `<div class="card">
    <h3>Potential Change Impact <span class="pill ${sevMap[ia.severity]}" style="margin-left:6px;">${ia.severity}</span></h3>
    <p class="hint">Changing <b>${doc.id} — ${esc(doc.name)}</b> may affect the following. Review this before approving the revision.</p>
    <div class="row-2">
      <div><b style="font-size:11.5px;">Related documents</b>${ia.relatedDocs.length?ia.relatedDocs.map(rd=>`<div style="font-size:12px;padding:3px 0;">${rd.id} — ${esc(rd.name)}</div>`).join(""):emptyInline("None linked.")}</div>
      <div><b style="font-size:11.5px;">Records generated by this document</b>${ia.relatedRecords.length?ia.relatedRecords.map(r=>`<div style="font-size:12px;padding:3px 0;">${esc(r.name)}</div>`).join(""):emptyInline("None found.")}</div>
    </div>
    <div class="row-2" style="margin-top:10px;">
      <div><b style="font-size:11.5px;">ISO / standard clauses affected</b><div style="margin-top:4px;">${ia.isoClauses.length?ia.isoClauses.map(clausePillHTML).join(""):emptyInline("None mapped.")}</div></div>
      <div><b style="font-size:11.5px;">Training &amp; distribution</b><div style="font-size:12px;padding:3px 0;">${ia.trainingFlag?"Training/acknowledgement is required on this document — republishing will reopen it for affected users.":"No training currently flagged."} ${ia.distributionCount?`· Currently distributed to ${ia.distributionCount} recipient(s).`:""}</div></div>
    </div>
  </div>`;
}

DOCUMENT METADATA

Review this document for:

/* ---------------------- Document comparison (version vs version) ---------------------- */
const COMPARE_FIELDS = [
  {key:"owner", label:"Owner"}, {key:"compiler", label:"Compiler"}, {key:"approver", label:"Approver"},
  {key:"classification", label:"Classification"}, {key:"criticality", label:"Criticality"},
  {key:"retentionPeriod", label:"Retention period"}, {key:"dept", label:"Department"}, {key:"process", label:"Process"},
  {key:"desc", label:"Change description"}, {key:"description", label:"Description"}
];
function diffVersions(vA, vB){
  const rows = COMPARE_FIELDS.map(f=>({label:f.label, a:vA[f.key]||"—", b:vB[f.key]||"—", changed: JSON.stringify(vA[f.key]||"")!==JSON.stringify(vB[f.key]||"")}));
  const clausesA = (vA.isoClauses||[]).slice().sort(); const clausesB = (vB.isoClauses||[]).slice().sort();
  rows.push({label:"ISO / standard clauses", a:clausesA.join(", ")||"—", b:clausesB.join(", ")||"—", changed: JSON.stringify(clausesA)!==JSON.stringify(clausesB)});
  return rows;
}
function openCompareVersionsModal(docId){
  const d = findDoc(docId); if(!d || d.history.length<2) return;
  const options = d.history.map((h,i)=>`<option value="${i}">v${h.version} (rev ${h.revision}) — ${fmtDate(h.date)}</option>`).join("");
  const html = `<div class="modal wide">
    <div class="modal-head"><h2>Compare Versions — ${d.id}</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="row-2">
      <div class="field"><label>Version A</label><select id="cmp-a" onchange="renderVersionDiff('${d.id}')">${options}</select></div>
      <div class="field"><label>Version B</label><select id="cmp-b" onchange="renderVersionDiff('${d.id}')">${d.history.map((h,i)=>`<option value="${i}" ${i===d.history.length-1?"selected":""}>v${h.version} (rev ${h.revision}) — ${fmtDate(h.date)}</option>`).join("")}</select></div>
    </div>
    <div id="version-diff-output"></div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Close</button></div>
  </div>`;
  openModal(html);
  renderVersionDiff(docId);
}
function renderVersionDiff(docId){
  const d = findDoc(docId); if(!d) return;
  const ai = +document.getElementById("cmp-a").value, bi = +document.getElementById("cmp-b").value;
  const vA = d.history[ai], vB = d.history[bi];
  const rows = diffVersions(vA, vB);
  const changedCount = rows.filter(r=>r.changed).length;
  const out = document.getElementById("version-diff-output");
  out.innerHTML = `<div class="card" style="margin-top:12px;">
    <h3>v${vA.version} → v${vB.version} <span class="pill ${changedCount?"pill-amber":"pill-green"}" style="margin-left:6px;">${changedCount} field(s) changed</span></h3>
    <table><thead><tr><th>Field</th><th>v${esc(vA.version)}</th><th>v${esc(vB.version)}</th></tr></thead><tbody>
    ${rows.map(r=>`<tr style="${r.changed?"background:#fdf1dc;":""}"><td><b>${esc(r.label)}</b></td><td>${esc(String(r.a))}</td><td>${esc(String(r.b))}</td></tr>`).join("")}
    </tbody></table>
    <div class="row-actions" style="margin-top:12px;"><button class="btn btn-primary btn-sm no-print" onclick="generateChangeSummary('${docId}', ${ai}, ${bi})">Generate Change Summary (AI)</button></div>
    <div id="change-summary-output" style="margin-top:10px;"></div>
  </div>`;
}
async function generateChangeSummary(docId, ai, bi){
  const d = findDoc(docId); if(!d) return;
  const out = document.getElementById("change-summary-output");
  if(!providerReady()){ out.innerHTML = `<div class="banner banner-warn">No AI provider configured — see Administration → AI Configuration.</div>`; return; }
  out.innerHTML = `<div class="ai-callout">Generating change summary…</div>`;
  const rows = diffVersions(d.history[ai], d.history[bi]).filter(r=>r.changed);
  const prompt = `Summarise the following field-level changes to a controlled QMS document (${d.id} — ${d.name}) between version ${d.history[ai].version} and version ${d.history[bi].version}, for a reviewer who has not seen the document. Be factual and concise (under 120 words), and do not speculate about anything not listed below.\n\nChanges:\n${rows.map(r=>`- ${r.label}: "${r.a}" → "${r.b}"`).join("\n")}\n\nIf the list above is empty, say plainly that no tracked metadata fields changed between these two versions.`;
  const result = await callAIProvider(prompt, 300);
  if(!result.ok){ out.innerHTML = aiErrorHTML(result); return; }
  out.innerHTML = `<div class="ai-callout"><div style="font-size:11px;color:var(--ink-soft);margin-bottom:4px;">AI-generated (${esc(result.provider)}) — advisory only, verify against the table above.</div><div style="white-space:pre-wrap;font-size:12.5px;line-height:1.6;">${esc(result.text)}</div></div>`;
}

function openNewControlledCopyModal(){

function acknowledgeCopy(id){
  const c = state.controlledCopies.find(x=>x.id===id); if(!c) return;
  c.ackDate = todayISO(); c.status = "Acknowledged";
  logAudit("Controlled copy acknowledged", c.docId, id, {objectType:"ControlledCopy"});
  saveLocal(); renderApp(); toast("Marked acknowledged.");
}
function revokeCopy(id){
  const c = state.controlledCopies.find(x=>x.id===id); if(!c) return;
  if(!confirm(`Revoke controlled copy ${id}? It will be marked as no longer a valid controlled copy.`)) return;
  c.status = "Revoked"; c.revokedDate = todayISO();
  logAudit("Controlled copy revoked", c.docId, id, {objectType:"ControlledCopy"});
  saveLocal(); renderApp(); toast("Copy revoked.");
}
function ackDoc(docId,userName){
  const d = findDoc(docId); d.acknowledgements = d.acknowledgements||[];
  if(!d.acknowledgements.includes(userName)) d.acknowledgements.push(userName);
  logAudit("Training/acknowledgement recorded", docId, userName);
  saveLocal(); renderApp(); toast("Recorded.");
}

    const fileInput = formEl.querySelector('input[name="file"]');
    const file = fileInput && fileInput.files[0];

    if(file){ submitBtn.disabled=true; submitBtn.textContent="Uploading…"; fileMeta = await attachFile(file); }
    const accessControl = resolveAccessControl(f, formEl);
    state.records.push({id:uid("REC"), name:f.get("name"), originatingDoc:f.get("originatingDoc")||"", type:f.get("type")||"Record",
      date:f.get("date"), owner:f.get("owner")||"", process:"", classification:f.get("classification"),

      fileName:fileMeta.fileName, fileData:fileMeta.fileData, fileEmbedded:fileMeta.fileEmbedded, cloudUrl:fileMeta.cloudUrl, storagePath:fileMeta.storagePath, storedInCloud:fileMeta.storedInCloud,
      accessControl});
    logAudit("Record registered","",f.get("name")+(fileMeta.storedInCloud?" (file in Firebase)":""));
    closeModal(); renderApp(); toast("Record registered.");
  });
}
