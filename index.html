function buildReportBody(id){
  const docs = state.documents;
  if(id==="register") return reportHeader("Document Register Report")+`<table><thead><tr><th>ID</th><th>Name</th><th>Type</th><th>Owner</th><th>Status</th><th>Version</th><th>Effective</th><th>Next review</th></tr></thead><tbody>
    ${docs.map(d=>`<tr><td class="mono">${d.id}</td><td>${esc(d.name)}</td><td>${d.type}</td><td>${esc(d.owner)}</td><td>${statusPill(d.status)}</td><td>${d.version}</td><td>${fmtDate(d.dates.effective)}</td><td>${fmtDate(d.dates.nextReview)}</td></tr>`).join("")}</tbody></table>`;
  if(id==="status"){
    const byStatus = {}; STATUSES.forEach(s=>byStatus[s]=docs.filter(d=>d.status===s).length);
    return reportHeader("Document Status Report")+`<table><thead><tr><th>Status</th><th>Count</th></tr></thead><tbody>${STATUSES.map(s=>`<tr><td>${statusPill(s)}</td><td>${byStatus[s]}</td></tr>`).join("")}</tbody></table>`;
  }
  if(id==="reviewrpt") return reportHeader("Document Review Report")+(state.reviews.length?`<table><thead><tr><th>Document</th><th>Reviewer</th><th>Due</th><th>Status</th></tr></thead><tbody>${state.reviews.map(r=>`<tr><td>${r.docId} — ${esc(r.docName)}</td><td>${esc(r.reviewer)}</td><td>${fmtDate(r.dueDate)}</td><td>${statusPill2(r.status)}</td></tr>`).join("")}</tbody></table>`:emptyInline("No reviews recorded."));
  if(id==="approvalrpt") return reportHeader("Document Approval Report")+(state.approvals.length?`<table><thead><tr><th>Document</th><th>Approver</th><th>Requested</th><th>Status</th></tr></thead><tbody>${state.approvals.map(a=>`<tr><td>${a.docId} — ${esc(a.docName)}</td><td>${esc(a.approver)}</td><td>${fmtDate(a.requestedDate)}</td><td>${statusPill2(a.status)}</td></tr>`).join("")}</tbody></table>`:emptyInline("No approvals recorded."));
  if(id==="isorpt") return reportHeader("ISO 9001 Control Matrix")+`<table><thead><tr><th>Clause</th><th>Requirement</th><th>Status</th><th>Documents</th></tr></thead><tbody>
    ${CLAUSES.map(c=>`<tr><td class="mono">${c.n}</td><td>${c.t}</td><td>${(()=>{const s=clauseComplianceStatus(c.n);return `<span class="pill ${ISO_STATUS_PILL[s]||"pill-grey"}">${s}</span>`;})()}</td><td>${state.documents.filter(d=>(d.isoClauses||[]).includes(c.n)).map(d=>d.id).join(", ")||"—"}</td></tr>`).join("")}</tbody></table>`;
  if(id==="aus32rpt") return reportHeader("AUS 32 (ISO 22241) Control Matrix")+STANDARDS.filter(s=>s.id!=="9001").map(s=>`
    <div class="section-title" style="margin-top:14px;">${esc(s.label)}</div>
    <table><thead><tr><th>Clause</th><th>Requirement</th><th>Status</th><th>Documents</th></tr></thead><tbody>
    ${s.clauses.map(c=>`<tr><td class="mono">${esc(clauseShortId(c.n))}</td><td>${esc(c.t)}</td><td>${(()=>{const st=clauseComplianceStatus(c.n);return `<span class="pill ${ISO_STATUS_PILL[st]||"pill-grey"}">${st}</span>`;})()}</td><td>${state.documents.filter(d=>(d.isoClauses||[]).includes(c.n)).map(d=>d.id).join(", ")||"—"}</td></tr>`).join("")}
    </tbody></table>`).join("");
  if(id==="gaprpt") return reportHeader("Documentation Gap Analysis Report")+`<table><thead><tr><th>Clause</th><th>Status</th></tr></thead><tbody>${CLAUSES.filter(c=>!["Effective"].includes(clauseComplianceStatus(c.n))).map(c=>`<tr><td>${c.n} — ${c.t}</td><td><span class="pill ${ISO_STATUS_PILL[clauseComplianceStatus(c.n)]||"pill-grey"}">${clauseComplianceStatus(c.n)}</span></td></tr>`).join("")||"<tr><td colspan=2>No gaps identified — every clause has reached Effective status.</td></tr>"}</tbody></table>`;
  if(id==="dcrrpt") return reportHeader("Document Change Request (DCR) Status Report")+(state.dcrs.length?`<table><thead><tr><th>DCR</th><th>Document</th><th>Category</th><th>Urgency</th><th>Status</th></tr></thead><tbody>${state.dcrs.map(d=>`<tr><td>${d.id}</td><td>${d.docId} — ${esc(d.docName)}</td><td>${d.category}</td><td>${d.urgency}</td><td>${dcrStatusPill(d.status)}</td></tr>`).join("")}</tbody></table>`:emptyInline("No change requests recorded."));
  if(id==="copyrpt") return reportHeader("Controlled Distribution Report")+(state.controlledCopies.length?`<table><thead><tr><th>Document</th><th>Recipient</th><th>Copy type</th><th>Issue date</th><th>Status</th></tr></thead><tbody>${state.controlledCopies.map(c=>`<tr><td>${c.docId} — ${esc(c.docName)}</td><td>${esc(c.recipient)}</td><td>${c.copyType}</td><td>${fmtDate(c.issueDate)}</td><td>${copyStatusPill(c.status)}</td></tr>`).join("")}</tbody></table>`:emptyInline("No controlled copies recorded."));
  if(id==="legalholdrpt") return reportHeader("Legal Hold Report")+(state.legalHolds.length?`<table><thead><tr><th>Hold</th><th>Reason</th><th>Authorised by</th><th>Records</th><th>Status</th></tr></thead><tbody>${state.legalHolds.map(h=>`<tr><td>${h.id}</td><td>${esc(h.reason)}</td><td>${esc(h.authorisedBy)}</td><td>${h.records.length}</td><td><span class="pill ${h.status==='Active'?'pill-purple':'pill-grey'}">${h.status}</span></td></tr>`).join("")}</tbody></table>`:emptyInline("No legal holds recorded."));
  if(id==="externalrpt") return reportHeader("External Document Report")+`<table><thead><tr><th>Title</th><th>Source</th><th>Review date</th><th>Status</th></tr></thead><tbody>${state.externalDocs.map(e=>`<tr><td>${esc(e.title)}</td><td>${esc(e.source)}</td><td>${fmtDate(e.reviewDate)}</td><td>${e.status}</td></tr>`).join("")}</tbody></table>`;
  if(id==="retentionrpt") return reportHeader("Records Retention Report")+`<table><thead><tr><th>Record</th><th>Retention</th><th>Disposal eligible</th></tr></thead><tbody>${state.records.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.retentionPeriod)}</td><td>${fmtDate(r.disposalDate)}</td></tr>`).join("")}</tbody></table>`;
  if(id==="disposalrpt") return reportHeader("Disposal Report")+(state.disposals.length?`<table><thead><tr><th>Record</th><th>Date</th><th>Method</th><th>Authorised by</th></tr></thead><tbody>${state.disposals.map(d=>`<tr><td>${esc(d.recordName)}</td><td>${fmtDate(d.date)}</td><td>${d.method}</td><td>${esc(d.authorisedBy)}</td></tr>`).join("")}</tbody></table>`:emptyInline("No disposals recorded."));
  if(id==="ownerrpt"){
    const owners = [...new Set(docs.map(d=>d.owner).filter(Boolean))];
    return reportHeader("Document Owner Report")+`<table><thead><tr><th>Owner</th><th>Documents</th></tr></thead><tbody>${owners.map(o=>`<tr><td>${esc(o)}</td><td>${docs.filter(d=>d.owner===o).map(d=>d.id).join(", ")}</td></tr>`).join("")||"<tr><td colspan=2>No owners assigned yet.</td></tr>"}</tbody></table>`;
  }
  if(id==="auditrpt") return reportHeader("Audit Trail Report (most recent 100)")+`<table><thead><tr><th>Date</th><th>User</th><th>Action</th><th>Document</th></tr></thead><tbody>${state.auditLog.slice(0,100).map(l=>`<tr><td>${fmtDate(l.ts.slice(0,10))}</td><td>${esc(l.user)}</td><td>${esc(l.action)}</td><td>${l.docId||"—"}</td></tr>`).join("")}</tbody></table>`;
  if(id==="trainingrpt"){
    const needing = docs.filter(d=>d.trainingRequired);
    return reportHeader("Training / Acknowledgement Report")+(needing.length?`<table><thead><tr><th>Document</th><th>Acknowledged</th><th>Outstanding</th></tr></thead><tbody>${needing.map(d=>`<tr><td>${d.id} — ${esc(d.name)}</td><td>${(d.acknowledgements||[]).join(", ")||"—"}</td><td>${state.users.filter(u=>!(d.acknowledgements||[]).includes(u.name)).map(u=>u.name).join(", ")||"None"}</td></tr>`).join("")}</tbody></table>`:emptyInline("No documents currently require training."));
  }
  if(id==="mgmtrpt"){
    const overdue = docs.filter(d=>d.dates.nextReview && daysUntil(d.dates.nextReview)<0).length;
    return reportHeader("Monthly QMS Document Control Management Report")+`
    <div class="section-title" style="margin-top:0;">1. Executive summary</div>
    <p style="font-size:12.5px;">${docs.length} controlled documents are held in the register, of which ${docs.filter(d=>["Effective","Published"].includes(d.status)).length} are currently effective. ${overdue} document(s) are overdue for review and ${state.alerts.length} alert(s) are currently open across the console.</p>
    <div class="section-title">2. Documentation status</div>${buildReportBody("status")}
    <div class="section-title">3. ISO 9001 coverage</div>${buildReportBody("isorpt")}
    <div class="section-title">4. Documentation gaps</div>${buildReportBody("gaprpt")}
    <div class="section-title">5. Records retention & disposal</div>${buildReportBody("retentionrpt")}`;
  }
  if(id==="evidencepack"){
    return reportHeader("ISO 9001 Audit Evidence Pack")+`
    <p style="font-size:12.5px;">This pack compiles the document register, clause mapping, review/approval evidence, external documents, records and audit trail currently held in the console for auditor reference.</p>
    <div class="section-title" style="margin-top:14px;">Document register</div>${buildReportBody("register")}
    <div class="section-title">ISO 9001 clause mapping</div>${buildReportBody("isorpt")}
    <div class="section-title">Review evidence</div>${buildReportBody("reviewrpt")}
    <div class="section-title">Approval evidence</div>${buildReportBody("approvalrpt")}
    <div class="section-title">External documents</div>${buildReportBody("externalrpt")}
    <div class="section-title">Records</div>${buildReportBody("retentionrpt")}
    <div class="section-title">Audit trail (recent)</div>${buildReportBody("auditrpt")}`;
  }
  return emptyInline("Select a report above.");
}

/* ---------------------- Traceability ---------------------- */
function renderTrace(){
  const cn = ui._arg;
  let html = `<div class="field" style="max-width:460px;"><label>Select a clause (any registered standard)</label>
  <select onchange="ui._arg=this.value;renderApp();">
    <option value="">—</option>
    ${STANDARDS.map(s=>`<optgroup label="${esc(s.label)}">${s.clauses.map(c=>`<option value="${c.n}" ${cn===c.n?"selected":""}>${esc(clauseShortId(c.n))} — ${esc(c.t)}</option>`).join("")}</optgroup>`).join("")}
  </select></div>`;
  if(cn){
    const clause = clauseLookup(cn);
    const docs = state.documents.filter(d=>(d.isoClauses||[]).includes(cn));
    const records = state.records.filter(r=>docs.some(d=>d.name===r.originatingDoc));
    const status = clauseComplianceStatus(cn);
    html += `
    <div class="card" style="margin-top:16px;">
      <h3>Traceability chain — ${esc(clause?clause.stdLabel:"")} · ${esc(clauseShortId(cn))}</h3>
      <div class="timeline">
        <div class="tl-item"><div class="tl-t">Clause</div><div class="tl-m">${esc(clauseShortId(cn))} — ${esc(clause?clause.t:"")}</div></div>
        <div class="tl-item"><div class="tl-t">Process(es)</div><div class="tl-m">${[...new Set(docs.map(d=>d.process).filter(Boolean))].join(", ")||"Not yet linked"}</div></div>
        <div class="tl-item"><div class="tl-t">Document(s)</div><div class="tl-m">${docs.length?docs.map(d=>`<span class="link-cell" onclick="openDocProfile('${d.id}')">${d.id} — ${esc(d.name)}</span>`).join(", "):"None mapped — this is a documentation gap"}</div></div>
        <div class="tl-item"><div class="tl-t">Version / status</div><div class="tl-m">${docs.map(d=>`${d.id}: v${d.version} — ${d.status}`).join(" · ")||"—"}</div></div>
        <div class="tl-item"><div class="tl-t">Review / approval evidence</div><div class="tl-m">${docs.map(d=>`${d.id}: owner ${d.owner||"—"}, approved by ${d.approver||"—"}`).join(" · ")||"—"}</div></div>
        <div class="tl-item"><div class="tl-t">Record(s) generated</div><div class="tl-m">${records.length?records.map(r=>r.name).join(", "):"None registered"}</div></div>
        <div class="tl-item"><div class="tl-t">Evidence status</div><div class="tl-m"><span class="pill ${ISO_STATUS_PILL[status]||"pill-grey"}">${status}</span></div></div>
      </div>
    </div>`;
  } else {
    html += `<div class="card" style="margin-top:16px;"><div class="empty">Select a clause above to trace it through process, document, version, review, approval and record evidence.</div></div>`;
  }
  document.getElementById("view").innerHTML = html;
}

function renderVerify(){
  const q = ui._verifyQuery || {id:"", code:""};
  const resultHtml = ui._verifyResult || "";
  let html = `<div class="card">
    <h3>Verify a Document</h3>
    <p class="hint">Confirm whether a document — and optionally a specific verification code printed on a controlled copy — is the current controlled version. Every document generates a verification code the moment it becomes Effective.</p>
    <div class="row-2">
      <div class="field"><label>Document ID</label><input id="verify-id" placeholder="e.g. QMS-PRO-001" value="${esc(q.id)}"></div>
      <div class="field"><label>Verification code (optional)</label><input id="verify-code" placeholder="From the document footer" value="${esc(q.code)}"></div>
    </div>
    <button class="btn btn-primary btn-sm no-print" onclick="runVerify()">Verify</button>
  </div>
  <div id="verify-result" style="margin-top:16px;">${resultHtml}</div>`;
  document.getElementById("view").innerHTML = html;
}
function runVerify(){
  const id = (document.getElementById("verify-id").value||"").trim();
  const code = (document.getElementById("verify-code").value||"").trim();
  ui._verifyQuery = {id, code};
  const el = document.getElementById("verify-result");
  if(!id){ el.innerHTML = `<div class="banner banner-warn">Enter a document ID to verify.</div>`; ui._verifyResult = el.innerHTML; return; }
  const matches = state.documents.filter(d=>d.id.toLowerCase()===id.toLowerCase());
  if(!matches.length){ el.innerHTML = `<div class="banner banner-danger">No document found with ID "${esc(id)}".</div>`; ui._verifyResult = el.innerHTML; return; }
  const target = matches.find(d=>code && d.verificationCode===code) || matches.find(d=>["Effective","Published"].includes(d.status)) || matches[0];
  const isCurrent = ["Effective","Published"].includes(target.status);
  const codeMismatch = !!(code && target.verificationCode && target.verificationCode!==code);
  el.innerHTML = `<div class="card">
    <div class="banner ${isCurrent && !codeMismatch ? "banner-ok":"banner-danger"}">
      ${codeMismatch ? "The verification code entered does NOT match this document's current controlled version." : isCurrent ? "This is the CURRENT controlled version." : `This document is NOT current — its status is ${target.status}.`}
    </div>
    <table>
      <tr><td style="font-weight:700;color:var(--ink-soft);width:180px;">Document</td><td>${target.id} — ${esc(target.name)}</td></tr>
      <tr><td style="font-weight:700;color:var(--ink-soft);">Version / Revision</td><td>${target.version} / ${target.revision}</td></tr>
      <tr><td style="font-weight:700;color:var(--ink-soft);">Status</td><td>${statusPill(target.status)}</td></tr>
      <tr><td style="font-weight:700;color:var(--ink-soft);">Effective date</td><td>${fmtDate(target.dates.effective)}</td></tr>
      <tr><td style="font-weight:700;color:var(--ink-soft);">Verification code</td><td class="mono">${target.verificationCode||"— not yet published —"}</td></tr>
    </table>
    <button class="btn btn-ghost btn-sm no-print" style="margin-top:10px;" onclick="openDocProfile('${target.id}')">Open document profile</button>
  </div>`;
  ui._verifyResult = el.innerHTML;
}

/* ================================================================
   HELP & GUIDE
   ================================================================ */
const FAQ_ITEMS = [
  {q:"How do I create a new document?", a:"Go to Documents and choose one of three routes: <b>+ New Document</b> for a blank controlled draft you'll write yourself, <b>Create with AI</b> to generate a first draft from a structured prompt, or <b>Upload Existing Document</b> if the document already exists outside the console (Word/PDF/etc.). All three end up in the same Document Register with full metadata."},
  {q:"What's the difference between the three ways to add a document?", a:"New Document and Create with AI both start the document at Draft status with no version history. Upload Existing Document lets you set the document's <i>real</i> current status (Draft, Effective, Superseded, etc.) since it may already be in force — useful for loading in documents you already had before using this console."},
  {q:"How does a document move from Draft to Effective?", a:"Draft → Request Review → reviewer approves or requests changes → Request Approval → approver approves → Publish. Publishing sets the Effective date, calculates the next review date from the document's criticality, and automatically supersedes any prior version with the same name."},
  {q:"Can the same person compile and approve a document?", a:"Only if your Segregation of Duties rules allow it (Administration → QMS Control Rules). By default the compiler can't approve their own document, the reviewer can't also approve, and Critical documents require someone independent of the owner, compiler and reviewer. Breaking a rule requires a logged override reason."},
  {q:"What is a Document Change Request (DCR) and when do I need one?", a:"A DCR is the formal starting point for revising an <i>existing</i> document — it records why the change is needed and shows the Impact Analysis (related documents, records, ISO clauses, training) before you commit to revising. Raise one from Change Requests (DCR) or from a document's profile via \"Raise Change Request (DCR)\", then use it to Start Revision."},
  {q:"Why can't I edit a document's metadata once it's Effective?", a:"An effective, approved version is treated as immutable — this is core to document control. To change anything, use \"Start Revision\" (or a DCR) on the document profile, which opens a new working version while the current one stays in force."},
  {q:"What happens to the old version when I publish a new one?", a:"It's automatically marked Superseded and stays fully accessible and traceable — it's never deleted. Any pending approvals tied to the old version cycle are invalidated so nothing gets approved against a version that no longer exists."},
  {q:"What's the difference between a Document and a Record?", a:"A Document defines a requirement or method (e.g. a blank inspection form). A Record is evidence that something happened (e.g. a completed inspection form). Register documents under Documents, and register records under Records — they follow different rules, especially for retention and disposal."},
  {q:"What stops a record being disposed of too early, or by mistake?", a:"Every record has a retention period and disposal-eligible date. Disposal is only offered once that date has passed, and a Legal Hold on a record blocks disposal outright until the hold is released — the button is disabled and the system tells you why."},
  {q:"How do I map a document to ISO 9001 or ISO 22241 (AUS 32)?", a:"On any document creation/upload form or its Metadata tab, tick the relevant clause(s) under \"ISO Standards\" — both standards are listed together, grouped by standard. A document can map to clauses from both at once."},
  {q:"Why does a clause show \"Gap\" or \"Partial\" even though a document exists?", a:"A document existing isn't the same as the requirement being demonstrated as effective. Status only reaches \"Effective\" once the mapped document is actually in force, has an owner, isn't overdue for review, and has at least one record showing it's being used. See the ISO Standards module for the exact logic."},
  {q:"Is AI-generated content automatically published?", a:"No. Anything from Create with AI enters Draft status and must go through the same Review → Approval → Publish steps as any other document. AI Review (on a document's profile) is advisory only and is clearly labelled as requiring human validation."},
  {q:"How do I verify whether a printed or shared document is still current?", a:"Use Verify a Document in the sidebar and enter the Document ID (and its verification code, if you have a printed copy showing one). It tells you plainly whether that's the current controlled version or something superseded."},
  {q:"Where is my data stored, and can I access it from another device?", a:"By default, everything is stored only in this browser (local storage). To access the same data from any device, connect Firebase under Administration → Cloud Sync — once signed in, changes sync automatically a moment after you make them."},
];
function renderHelp(){
  const tab = ui.helpTab || "faq";
  let html = `<div class="tabs no-print">
    ${[["faq","FAQ"],["setup","Setup Guide"],["usage","Using the Console"],["features","Key Features"]].map(([id,label])=>`<div class="tab ${tab===id?"active":""}" onclick="ui.helpTab='${id}';renderApp();">${label}</div>`).join("")}
  </div>`;
  if(tab==="faq"){
    html += `<div class="card"><h3>Frequently asked questions</h3>
      <p class="hint">Quick answers covering the end-to-end process of using this console — from creating a document through to disposal.</p>
      ${FAQ_ITEMS.map(f=>`<details style="border-bottom:1px solid var(--line);padding:10px 0;">
        <summary style="cursor:pointer;font-weight:700;font-size:13px;color:var(--navy-900);">${esc(f.q)}</summary>
        <div style="font-size:12.5px;line-height:1.6;color:var(--ink);margin-top:8px;padding-left:2px;">${f.a}</div>
      </details>`).join("")}
    </div>`;
  } else if(tab==="setup"){
    html += `<div class="card"><h3>Setting up the console</h3>

async function testAIKey(){
  const key = document.getElementById("ai-key-input").value.trim();
  const result = document.getElementById("ai-key-test-result");
  if(!key){ result.innerHTML = `<div class="banner banner-danger">Enter a key first.</div>`; return; }
  result.innerHTML = `<div class="ai-callout">Testing connection…</div>`;
  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body: JSON.stringify({model:"claude-sonnet-4-6", max_tokens:16, messages:[{role:"user", content:"Reply with OK."}]})
    });
    let data; try{ data = await response.json(); }catch(e){ data = null; }
    if(response.ok){
      result.innerHTML = `<div class="banner banner-ok">Connection successful — the key works.</div>`;
    } else {
      const msg = data && data.error && data.error.message ? data.error.message : `HTTP ${response.status}`;
      result.innerHTML = `<div class="banner banner-danger"><b>Connection failed:</b> ${esc(msg)}</div>`;
    }
  }catch(err){
    result.innerHTML = `<div class="banner banner-danger"><b>Could not reach the API</b> (${esc(err.message||String(err))}). This is often a network/CORS restriction in the current browser or environment.</div>`;
  }
}

  const docs = state.documents.filter(d=>d.accessControl && d.accessControl.mode && d.accessControl.mode!=="everyone").map(d=>({id:d.id,label:`Document: ${d.id} — ${d.name}`}));
  const exts = state.externalDocs.filter(d=>d.accessControl && d.accessControl.mode && d.accessControl.mode!=="everyone").map(d=>({id:d.id,label:`External: ${d.title}`}));
  const recs = state.records.filter(d=>d.accessControl && d.accessControl.mode && d.accessControl.mode!=="everyone").map(d=>({id:d.id,label:`Record: ${d.name}`}));
  return [...docs, ...exts, ...recs];
}
function grantedItemsFieldHTML(granted){
  granted = granted||[];
  const items = restrictedItemsList();
  if(!items.length) return `<div class="field"><label>Grant access to restricted items</label><div class="help">No restricted documents, external documents, or records exist yet. Set "Who can access this?" on an item to something other than Everyone, and it will appear here to grant as an individual exception.</div></div>`;
  return `<div class="field"><label>Grant access to restricted items</label>
    <div class="multi-check">${items.map(it=>`<label><input type="checkbox" name="grantedItems" value="${esc(it.id)}" ${granted.includes(it.id)?"checked":""}> ${esc(it.label)}</label>`).join("")}</div>
    <div class="help">Grants this specific user access to an otherwise-restricted item, regardless of that item's own Users/Roles/Departments rule — use it for individual exceptions.</div>
  </div>`;
}

function openEditUserModal(id){
  if(!can("user.manage")){ denyToast("user.manage"); return; }
  const u = state.users.find(x=>x.id===id); if(!u) return;
  const html = `<div class="modal wide"><div class="modal-head"><h2>Edit User</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
  <form id="user-edit-form">
    <div class="field"><label>Name</label><input name="name" required value="${esc(u.name)}"></div>
    <div class="row-2">
      ${designationFieldHTML(u.designation||"")}
      <div class="field"><label>System role</label><select name="role">${ROLES.map(r=>`<option ${u.role===r?"selected":""}>${r}</option>`).join("")}</select></div>
    </div>
    <div class="row-2">
      ${departmentFieldHTML(u.dept||"")}
      <div class="field"><label>Email</label><input name="email" type="email" value="${esc(u.email||"")}"></div>
    </div>
    ${grantedItemsFieldHTML(u.grantedItems||[])}
    <div class="modal-foot"><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button><button type="submit" class="btn btn-primary">Save Changes</button></div>
  </form></div>`;
  openModal(html);
  document.getElementById("user-edit-form").addEventListener("submit",function(e){
    e.preventDefault(); const f=new FormData(e.target);
    const oldName = u.name;
    const grantedItems = Array.from(e.target.querySelectorAll('input[name="grantedItems"]:checked')).map(x=>x.value);
    Object.assign(u,{name:f.get("name"), designation:resolveDesignation(f), role:f.get("role"), dept:resolveDept(f), email:f.get("email")||"", grantedItems});
    if(oldName!==u.name){
      // keep person references (owner/compiler/etc, reviewer/approver names) in sync
      state.documents.forEach(d=>{
        ["owner","compiler","techReviewer","qualityReviewer","approver"].forEach(f2=>{ if(d[f2]===oldName) d[f2]=u.name; });
      });
      state.reviews.forEach(r=>{ if(r.reviewer===oldName) r.reviewer=u.name; });
      state.approvals.forEach(a=>{ if(a.approver===oldName) a.approver=u.name; });
    }
    logAudit("User updated","",u.name);
    closeModal(); renderApp(); toast("User updated.");
  });
}
function removeUser(id){ if(!can("user.manage")){ denyToast("user.manage"); return; } if(!confirm("Remove this user?")) return; state.users = state.users.filter(u=>u.id!==id); saveLocal(); renderApp(); }

function renderSearch(){
  const q = (ui.search||"").toLowerCase();
  const docHits = accessibleDocuments().filter(d=>(d.id+" "+d.name+" "+d.keywords).toLowerCase().includes(q));
  const clauseHits = allClauses().filter(c=>(c.n+" "+c.t).toLowerCase().includes(q));
  const recHits = accessibleRecords().filter(r=>r.name.toLowerCase().includes(q));
  const extHits = accessibleExternalDocs().filter(e=>e.title.toLowerCase().includes(q));
  let html = `<div class="card" style="margin-bottom:12px;"><h3>Results for "${esc(ui.search)}"</h3></div>`;
  if(docHits.length) html += `<div class="card" style="margin-bottom:12px;"><h3>Documents</h3>${docHits.map(d=>`<div class="link-cell" onclick="openDocProfile('${d.id}')" style="padding:4px 0;">${d.id} — ${esc(d.name)}</div>`).join("")}</div>`;
  if(clauseHits.length) html += `<div class="card" style="margin-bottom:12px;"><h3>Standard Clauses</h3>${clauseHits.map(c=>`<div class="link-cell" onclick="goTo('trace','${c.n}')" style="padding:4px 0;">${esc(c.stdLabel)} — ${esc(clauseShortId(c.n))} — ${esc(c.t)}</div>`).join("")}</div>`;
  if(recHits.length) html += `<div class="card" style="margin-bottom:12px;"><h3>Records</h3>${recHits.map(r=>`<div style="padding:4px 0;">${esc(r.name)}</div>`).join("")}</div>`;
  if(extHits.length) html += `<div class="card" style="margin-bottom:12px;"><h3>External Documents</h3>${extHits.map(ex=>`<div style="padding:4px 0;">${esc(ex.title)}</div>`).join("")}</div>`;
  if(!docHits.length && !clauseHits.length && !recHits.length && !extHits.length) html += `<div class="card"><div class="empty">No matches found. Try a different search term.</div></div>`;
  document.getElementById("view").innerHTML = html;
}

/* ================================================================
   SERVICE LAYER — FIREBASE / CLOUDFLARE MIGRATION NOTES
   ================================================================
   This build persists everything through saveLocal()/tryLoadLocal() to the
   browser's localStorage. To move to Firebase without a UI rewrite, the
   intended path is:

       UI (render-view and open-modal functions)
         -> Application services (namespaces below)
           -> Repository layer (currently: direct `state.x` mutation + saveLocal())
             -> Firebase (Firestore reads/writes, Storage for files, Cloud
                Functions for anything needing a secret — e.g. Dropbox OAuth,
                outbound email, and the AI API key currently stored in
                Administration -> AI Configuration)

   The functions below are grouped into the service namespaces the master
   spec calls for. Today each one simply forwards to the existing function —
   they change nothing about behaviour. The point is that UI code already
   calls through a stable, named surface (e.g. DocumentService.publish(id))
   rather than scattering `state.documents.find(...)` mutations across
   rendering code. When a real backend is introduced, only the *body* of
   each service function needs to change (e.g. publish() becomes an async
   Firestore transaction) — callers do not.

   Firestore Security Rules (not this file) must enforce the PERMISSIONS
   map above server-side; the `can()` checks here only hide/disable UI. */

(function init(){
  if(FIREBASE_ENABLED){
    fbAuth.onAuthStateChanged(async function(user){
      fbUser = user;
      if(!user){ renderSignIn(); return; }
      const loadedFromCloud = await cloudLoad();
      if(!loadedFromCloud){ if(!tryLoadLocal()){ loadDemo(); } }
      renderApp();
    });
  } else {
    if(!tryLoadLocal()){ loadDemo(); }
    renderApp();
  }
})();
